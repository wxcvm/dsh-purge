name: One-time Linux runner recovery

on:
  push:
    branches: [chore/fujiang-linux-runner-recovery]

permissions:
  contents: read

jobs:
  recover:
    runs-on: [self-hosted, Windows, X64, purge-ci]
    timeout-minutes: 5
    steps:
      - name: Inspect WSL and resume the existing repository runner
        shell: pwsh
        run: |
          wsl.exe --list --verbose
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $script = @'
          set -eu
          dir="$HOME/actions-runner"
          if [ ! -f "$dir/.runner" ] || [ ! -x "$dir/run.sh" ]; then
            echo "No configured runner at the expected path in the default WSL distro."
            exit 2
          fi
          # Read only the repository URL, never credentials or tokens.
          python3 -c 'import json,sys; x=json.load(open(sys.argv[1])); sys.exit(0 if x.get("gitHubUrl","").rstrip("/").lower()=="https://github.com/wxcvm/dsh-purge" else 1)' "$dir/.runner" || {
            echo "Runner belongs to another repository or could not be identified; leaving it unchanged."
            exit 3
          }
          cd "$dir"
          running() {
            for pid in $(pgrep -x Runner.Listener || true); do
              if [ "$(readlink "/proc/$pid/exe" 2>/dev/null || true)" = "$dir/bin/Runner.Listener" ]; then
                return 0
              fi
            done
            return 1
          }
          if running; then
            echo "The existing Linux runner is already running."
            exit 0
          fi
          if [ -f .service ]; then
            unit=$(cat .service)
            case "$unit" in
              actions.runner.wxcvm-dsh-purge.*.service) ;;
              *) echo "Unexpected service name; no changes made."; exit 4 ;;
            esac
            if ! systemctl is-active --quiet "$unit"; then
              sudo -n systemctl start "$unit"
            fi
          else
            mkdir -p _diag
            nohup setsid ./run.sh </dev/null >_diag/purge-ci-recovery.log 2>&1 &
          fi
          for i in $(seq 1 15); do
            if running; then
              echo "Existing Linux runner listener is running; GitHub connectivity is verified separately."
              exit 0
            fi
            sleep 1
          done
          echo "Runner listener not observed after startup; inspect its local diagnostic logs."
          exit 5
          '@
          $script = $script.Replace("`r", "")
          wsl.exe --exec bash -lc $script
          exit $LASTEXITCODE
