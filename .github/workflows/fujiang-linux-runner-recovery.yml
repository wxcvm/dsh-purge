name: One-time Linux runner recovery

on:
  push:
    branches: [chore/fujiang-linux-runner-recovery]

permissions:
  contents: read

jobs:
  recover:
    runs-on: [self-hosted, Windows, X64, purge-ci]
    timeout-minutes: 5
    steps:
      - name: Reconnect existing idle WSL runner
        shell: pwsh
        run: |
          $script = @'
          set -eu
          dir="$HOME/actions-runner"
          cd "$dir"
          python3 -c 'import json,sys; x=json.load(open(sys.argv[1], encoding="utf-8-sig")); sys.exit(0 if x.get("gitHubUrl","").rstrip("/").lower()=="https://github.com/wxcvm/dsh-purge" else 1)' .runner
          # Do not interrupt an active job.
          if pgrep -x Runner.Worker >/dev/null; then
            echo "A runner worker is active; no restart performed."
            exit 0
          fi
          if [ -f .service ]; then
            unit=$(tr -d '\r\n' < .service)
            case "$unit" in
              actions.runner.wxcvm-dsh-purge.*.service) ;;
              *) echo "Unexpected service name; no changes made."; exit 4 ;;
            esac
            echo "Existing service state:"
            systemctl is-active "$unit" || true
            sudo -n systemctl restart "$unit"
            systemctl is-active "$unit"
          else
            # Only stop the listener belonging to this exact runner installation.
            for pid in $(pgrep -x Runner.Listener || true); do
              if [ "$(readlink "/proc/$pid/exe" 2>/dev/null || true)" = "$dir/bin/Runner.Listener" ]; then
                kill -TERM "$pid"
                for i in $(seq 1 10); do
                  kill -0 "$pid" 2>/dev/null || break
                  sleep 1
                done
                if kill -0 "$pid" 2>/dev/null; then
                  echo "Listener did not stop gracefully; no forced termination."
                  exit 5
                fi
              fi
            done
            mkdir -p _diag
            env -u RUNNER_TRACKING_ID nohup setsid ./run.sh </dev/null >_diag/purge-ci-recovery.log 2>&1 &
          fi
          echo "Restart requested for the existing idle runner."
          sleep 3
          pgrep -x Runner.Listener || true
          echo "Actual GitHub connectivity will be verified by queued jobs."
          exit 0
          '@
          $script = $script.Replace("`r", "")
          wsl.exe --exec bash -lc $script
          exit $LASTEXITCODE
