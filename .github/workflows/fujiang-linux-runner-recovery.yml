name: Prioritize Fujiang integration acceptance

on:
  push:
    branches: [chore/fujiang-linux-runner-recovery]

permissions:
  contents: read
  actions: write

jobs:
  prioritize:
    runs-on: [self-hosted, Windows, X64, purge-ci]
    timeout-minutes: 5
    steps:
      - name: Cancel redundant queued source-branch runs only
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json"; "X-GitHub-Api-Version" = "2022-11-28" }
          $base = "https://api.github.com/repos/wxcvm/dsh-purge"
          $integration = Invoke-RestMethod "$base/pulls/316" -Headers $headers
          if ($integration.state -ne 'open' -or $integration.head.sha -ne '1b3e8a8e9ebf28ee3e4aa72cce97f0b33911e8a0') { throw 'Integration head changed; no cancellation' }
          $runs = @{
            '43883062664' = 'fecda98071771611a081f765407fc794f757e786'
            '43880859702' = '0d5be2f07628f53c9a3a394fe2a62256d776f414'
            '43882938256' = '834f7fe8a8e81c65792b963cd4ba52bfa28aa1e1'
            '43883573815' = '766a16b079673dbc77f9b360a7d513d77d17517d'
            '43884565755' = 'a331253411560d90f3b76bc0120c8cf81ae3407d'
          }
          foreach ($id in $runs.Keys) {
            $run = Invoke-RestMethod "$base/actions/runs/$id" -Headers $headers
            if ($run.head_sha -ne $runs[$id] -or $run.event -ne 'pull_request' -or $run.status -notin @('queued','pending')) { Write-Host "Skip ${id}: changed or not queued"; continue }
            $jobs = (Invoke-RestMethod "$base/actions/runs/$id/jobs" -Headers $headers).jobs
            $linux = @($jobs | Where-Object { $_.name -eq 'api-contracts (ubuntu-latest)' })
            $windows = @($jobs | Where-Object { $_.name -eq 'api-contracts (windows-latest)' })
            if ($linux.Count -ne 1 -or $linux[0].status -ne 'queued' -or $windows.Count -ne 1 -or $windows[0].conclusion -ne 'success' -or @($jobs | Where-Object { $_.status -eq 'in_progress' }).Count -gt 0) {
              Write-Host "Skip ${id}: not a redundant queued Linux job"; continue
            }
            Invoke-RestMethod "$base/actions/runs/$id/cancel" -Method Post -Headers $headers | Out-Null
            Write-Host "Cancellation requested for redundant source run $id"
          }
          Write-Host 'Integrated run 43885877177 and active source runs were not cancelled.'
