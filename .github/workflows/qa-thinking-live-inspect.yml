name: QA Thinking Candidate Online
on:
  push:
    branches: [robin/qa-thinking-live-inspect-20261116]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, Windows]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: One normal task through official CLI with candidate read-only observer
        run: node scripts/qa-thinking-candidate-online.mjs
