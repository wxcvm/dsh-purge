name: Locate actual Harness runtime listener
on:
  push:
    branches: [robin/read-runtime-usage-once]
permissions:
  contents: read
jobs:
  preflight:
    runs-on: [self-hosted, Windows, X64, purge-ci]
    timeout-minutes: 2
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Inspect local Harness listeners without changing settings
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import {spawnSync} from 'node:child_process'
          const ps=String.raw`
          $ErrorActionPreference='SilentlyContinue'
          $names=@{}
          Get-Process | ForEach-Object {if($_.ProcessName -match '^(?:dsh(?:[._-].*)?|harness(?:[._-].*)?|deepseek(?:[._-].*)?|electron|node|nodejs|bun|ds-harness(?:[._-].*)?)$') {$names[[int]$_.Id]=$_.ProcessName}}
          $rows=@(Get-NetTCPConnection -State Listen | Where-Object {$names.ContainsKey([int]$_.OwningProcess)} | ForEach-Object {
           $family=if($_.LocalAddress -match ':'){'ipv6'}else{'ipv4'}
           $name=$names[[int]$_.OwningProcess]
           $kind=if($name -match 'node|bun'){'runtime'}elseif($name -eq 'electron'){'electron'}else{'harness'}
           [pscustomobject]@{port=$_.LocalPort;family=$family;kind=$kind}
          } | Sort-Object port,family,kind -Unique)
          [pscustomobject]@{matchingProcesses=$names.Count;listeners=$rows} | ConvertTo-Json -Compress -Depth 4
          `
          const result=spawnSync('powershell.exe',['-NoProfile','-NonInteractive','-Command',ps],{encoding:'utf8',timeout:12000,windowsHide:true,maxBuffer:1024*1024})
          let state=null;try{state=JSON.parse(result.stdout||'')}catch{}
          const rows=Array.isArray(state?.listeners)?state.listeners:[]
          const candidates=rows.filter(x=>Number.isInteger(x.port)&&x.port>0&&x.port<=65535&&['ipv4','ipv6'].includes(x.family)).slice(0,40)
          async function probe(x){
           const origin='http://'+(x.family==='ipv6'?'[::1]':'127.0.0.1')+':'+x.port
           try{
           const r=await fetch(origin+'/dsh-purge/runtime-observations?limit=1',{signal:AbortSignal.timeout(1800),redirect:'error'})
           const type=r.headers.get('content-type')||''
           let v=null
           if(type.includes('application/json')){try{v=await r.json()}catch{}}
           const verified=v?.schemaVersion===1&&v?.readOnly===true&&Array.isArray(v?.items)
           const latest=verified?v.items.slice(0,1).map(a=>({provider:/^deepseek(?:-ai)?$/i.test(a.provider||'')?a.provider:null,model:/^deepseek-(?:v4[.0-9-]*flash|flash|v4-pro)$/i.test(a.model||'')?a.model:null,providerSource:a.providerSource||null,modelSource:a.modelSource||null})):null
           return {port:x.port,family:x.family,kind:x.kind,http:r.status,verifiedRuntimeEndpoint:verified,latest}
           }catch{return {port:x.port,family:x.family,kind:x.kind,reachable:false}}
          }
          const probes=await Promise.all(candidates.map(probe))
          console.log('PURGE_LISTENER_CHECK='+JSON.stringify({status:state?'ok':'enumeration-failed',processCount:state?.matchingProcesses??null,candidateCount:rows.length,probed:probes.length,results:probes}))
          '@ | node --input-type=module -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
