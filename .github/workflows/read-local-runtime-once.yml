name: Inspect synthetic delegation tool arguments and prompt sizes
on:
  push:
    branches: [robin/read-runtime-usage-once]
permissions:
  contents: read
jobs:
  read:
    if: github.repository == 'wxcvm/dsh-purge' && github.ref == 'refs/heads/robin/read-runtime-usage-once'
    runs-on: [self-hosted, Windows, X64, purge-ci]
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Score only uniquely marked synthetic QA session
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import fs from 'node:fs'
          import path from 'node:path'
          import os from 'node:os'
          import zlib from 'node:zlib'
          const marker='PURGE-DS41-DELEGATE-02'
          const root=path.join(process.env.DSH_HOME||path.join(process.env.USERPROFILE||os.homedir(),'.dsh'),'sessions')
          const out=x=>console.log('PURGE_DS41_RESULT='+JSON.stringify(x))
          const home=process.env.DSH_HOME||path.join(process.env.USERPROFILE||os.homedir(),'.dsh')
          const promptPath=path.join(home,'prompt-inject.md')
          let promptInfo={exists:false,chars:null,bytes:null};try{const b=fs.readFileSync(promptPath);promptInfo={exists:true,chars:b.toString('utf8').length,bytes:b.length}}catch{}
          const logPath=path.join(os.tmpdir(),'dsh-purge-desktop.log')
          let internalLog=[];try{internalLog=fs.readFileSync(logPath,'utf8').split(/\\r?\\n/).filter(l=>/\\[(?:assemble\\.rewrite|inject\\.read)\\]/.test(l)).slice(-80).map(l=>l.replace(/ cwd=[^ ]+/,' cwd=[redacted]'))}catch{}
          const dirs=d=>{try{return fs.readdirSync(d,{withFileTypes:true}).filter(x=>x.isDirectory()&&!x.isSymbolicLink()).map(x=>x.name)}catch{return []}}
          const files=[]
          for(const a of dirs(root))for(const b of dirs(path.join(root,a))){const f=path.join(root,a,b,'session.v4.jsonl.zstd');try{const s=fs.lstatSync(f);if(s.isFile()&&!s.isSymbolicLink())files.push({f,id:b,mtime:s.mtimeMs,size:s.size})}catch{}}
          files.sort((a,b)=>b.mtime-a.mtime)
          const magic=Buffer.from([0x28,0xb5,0x2f,0xfd])
          const msg=e=>e?.data?.message??e?.data
          const txt=m=>typeof m?.content==='string'?m.content:(Array.isArray(m?.content)?m.content:[]).map(b=>typeof b==='string'?b:b?.type==='text'?b.text||'':'').join('\n')
          const num=v=>typeof v==='number'&&Number.isFinite(v)&&v>=0
          const fields=['inputTokens','outputTokens','totalTokens','cacheReadTokens','cacheWriteTokens','reasoningTokens']
          const knownModel=v=>typeof v==='string'&&/^deepseek(?:[-./:][a-z0-9_.:/-]+)?$/i.test(v)&&v.length<=100?v:null
          const knownProvider=v=>typeof v==='string'&&/^(deepseek|deepseek-ai|openai|deepseek-official|deepseek_official)$/i.test(v)?v:null
          const key={A1:'unverified',A2:'verified',B1:'unverified',B2:'contradicted'}
          const ts=e=>{for(const v of [e?.timestamp,e?.ts,e?.time]){const n=typeof v==='number'&&v>1e12&&v<1e14?v:typeof v==='string'&&/^\d{4}-\d\d-\d\dT/.test(v)?Date.parse(v):NaN;if(Number.isFinite(n))return n}return null}
          function score(t){
           let raw=t.trim(),strict=true,x
           try{x=JSON.parse(raw)}catch{strict=false;try{x=JSON.parse(raw.replace(/^\x60{3}(?:json)?\s*|\s*\x60{3}$/gi,''))}catch{return {valid:false,strict:false,passed:null,rows:[]}}}
           if(!Array.isArray(x?.reports)||x.reports.length!==4||new Set(x.reports.map(r=>r?.id)).size!==4||x.reports.some(r=>!Object.hasOwn(key,r?.id)))return {valid:false,strict,passed:null,rows:[]}
           const rows=x.reports.map(r=>({id:r.id,lifecycle:['completed','aborted','error','unknown'].includes(r.lifecycle)?r.lifecycle:'invalid',outcome:['verified','unverified','contradicted'].includes(r.outcome)?r.outcome:'invalid',correct:r.lifecycle==='completed'&&r.outcome===key[r.id]}))
           return {valid:rows.every(r=>r.lifecycle!=='invalid'&&r.outcome!=='invalid'),strict,passed:rows.filter(r=>r.correct).length,rows}
          }
          let scanned=0,bytes=0,incomplete=0,matches=[],children=[],parentRefs=new Map(),recent=[],markerHits=[]
          const newRun=(started)=>({toolNames:{},messageToolNames:{},toolCalls:[],started,route:{provider:null,model:null},attempts:[],final:null,ended:null,toolStarts:0,subagentToolStarts:0,turnEnds:[],parseComplete:true,childIds:new Set(),descriptorEvents:0})
          function scan(f,child=false,rank=null){
           if(f.size>64*1024*1024||bytes+f.size>256*1024*1024)return
           let buf;try{buf=fs.readFileSync(f.f)}catch{return}
           scanned++;bytes+=f.size
           let pending='',decoded=0,complete=true,active=child?newRun(null):null,seen=new Set(),found=[],metadata={rank,events:0,userMessages:0,baselineHits:0,delegateHits:0,qaSignatures:0,assistantEvents:0,descriptors:0,turnEnds:0}
           const finish=()=>{if(active){active.id=f.id;found.push(active);active=null}}
           function inspect(e0){

           const e=e0?.event&&typeof e0.event.type==='string'?e0.event:e0
           if(typeof e?.type!=='string')return
           if(Number.isSafeInteger(e.seq)){if(seen.has(e.seq))return;seen.add(e.seq)}
           const d=e.data
           metadata.events++;if(['assistant/message','assistant/attempt'].includes(e.type))metadata.assistantEvents++;if(['subagent/descriptor','subagent/catalog'].includes(e.type))metadata.descriptors++;if(e.type==='turn/end')metadata.turnEnds++
           const raw=JSON.stringify(e);if(raw.includes(marker)){metadata.delegateHits++;if(!child)markerHits.push({rank,type:['user/message','assistant/message','assistant/attempt','request/header','request/context','subagent/descriptor','subagent/catalog','turn/start','turn/end'].includes(e.type)?e.type:'other'})}if(raw.includes('PURGE-DS41-BASELINE-01'))metadata.baselineHits++;
           if(!child){for(const h of [e0.header,e.header,d?.header,e0.meta,e.meta,d]){if(typeof h?.parentSession==='string')parentRefs.set(f.id,h.parentSession)}}
           if(child&&active&&active.started===null&&ts(e)!==null)active.started=ts(e)
           if(e.type==='user/message'){
             const m=msg(e),source=d?.source??m?.source,t=txt(m)
             metadata.userMessages++
             const exactMarker=t.includes(marker)&&(/subagent|子智能体/.test(t))
             const signature=false
             if(signature)metadata.qaSignatures++
             if(child)return
             if(!exactMarker&&!signature&&source?.kind&&!['user','human'].includes(source.kind))return
             if(!exactMarker&&!signature&&/^\s*(?:<(?:system-reminder|openviking-context|dsh-purge)|Current runtime context|Time sampled)/i.test(t))return
             finish()
             if(exactMarker||signature){active=newRun(ts(e));active.matchBasis=exactMarker?'exact-marker':'qa-delegation-signature'}
             return
           }
           if(!active)return
           if(e.type==='subagent/descriptor'||e.type==='subagent/catalog'){
             active.descriptorEvents++
             const list=Array.isArray(d)?d:Array.isArray(d?.items)?d.items:Array.isArray(d?.children)?d.children:Array.isArray(d?.catalog)?d.catalog:[d]
             for(const v of list){const id=v?.childId||v?.sessionId||v?.descriptor?.id||v?.child?.id||v?.id;if(typeof id==='string'&&id!==f.id)active.childIds.add(id)}
           }
           if(e.type==='request/header')active.route={provider:knownProvider(d?.header?.config?.provider),model:knownModel(d?.header?.config?.model),source:'request-header'}
           if(e.type==='request/context'){const p=knownProvider(d?.provider),m=knownModel(d?.model);if(p)active.route.provider=p;if(m)active.route.model=m;if(p||m)active.route.source='request-context'}
           if(e.type==='assistant/message'||e.type==='assistant/attempt'){
             const u0=d?.usage,stream=Array.isArray(d?.stream)?d.stream:[]
             const addName=(bucket,n)=>{const k=typeof n==='string'&&/^[A-Za-z][A-Za-z0-9_.:-]{0,79}$/.test(n)?n:'unknown';bucket[k]=(bucket[k]||0)+1}
             for(const b of Array.isArray(d?.message?.content)?d.message.content:[]){
               if(!['tool-call','tool_call','tool-use','tool_use'].includes(b?.type))continue
               const name=b.name??b.toolName??b.tool?.name??b.function?.name??'unknown';addName(active.messageToolNames,name)
               let args=b.arguments??b.input??b.args??b.parameters??b.tool?.arguments??b.function?.arguments??null
               if(typeof args==='string'){try{args=JSON.parse(args)}catch{args={raw:args}}}
               const safe=v=>{if(typeof v!=='string')return null;return v.replace(/(?:api[_-]?key|token|secret|password|authorization|cookie)\\s*[:=]\\s*[^\\s,;]+/ig,'$1=[redacted]').replace(/Bearer\\s+[^\\s]+/ig,'Bearer [redacted]').slice(0,220)}
               const summary={name,type:b.type,blockKeys:Object.keys(b).slice(0,18),argKeys:args&&typeof args==='object'?Object.keys(args).filter(k=>!/(?:key|token|secret|password|authorization|cookie)/i.test(k)).slice(0,16):[],preview:{}}
               if(args&&typeof args==='object')for(const k of ['pattern','query','search','command','cmd','script','path','file','cwd','prompt','task','description','id','timeout'])if(Object.hasOwn(args,k)){const v=args[k];summary.preview[k]=typeof v==='string'?safe(v):typeof v==='number'||typeof v==='boolean'?v:Array.isArray(v)?{type:'array',length:v.length}:v&&typeof v==='object'?{type:'object',keys:Object.keys(v).filter(x=>!/(?:key|token|secret|password|authorization|cookie)/i.test(x)).slice(0,12)}:null}
               active.toolCalls.push(summary)
             }
             let u1=null,reason=null,text=''
             for(const r of stream){const c=r?.chunk;if(c?.type==='usage'&&fields.some(k=>num(c.usage?.[k])))u1=c.usage;if(c?.type==='finish')reason=c.reason?.kind;if(c?.type==='block-start'&&c.blockType==='tool-call'){active.toolStarts++;const n=c.name??c.toolName??c.tool?.name??c.block?.name??c.block?.toolName;addName(active.toolNames,n);if(['subagent','subagent_fork'].includes(n))active.subagentToolStarts++};if(c?.type==='text-delta'&&typeof c.text==='string')text+=c.text}
             const u=num(u0?.totalTokens)?u0:num(u1?.totalTokens)?u1:fields.some(k=>num(u0?.[k]))?u0:u1
             const route={...active.route}
             const mp=knownProvider(d?.message?.source?.provider),mm=knownModel(d?.message?.source?.model)
             if(mp)route.provider=mp;if(mm)route.model=mm;if(mp||mm)route.source='assistant-event'
             const a={event:e.type,finish:['stop','tool-calls','max-tokens','error','aborted','content_filter'].includes(reason)?reason:'unknown',route,usage:Object.fromEntries(fields.map(k=>[k,num(u?.[k])?u[k]:null]))}
             active.attempts.push(a)
             if(e.type==='assistant/message'){const response=txt(msg(e))||text;const candidates=[...response.matchAll(/\{\s*"reports"\s*:\s*\[[\s\S]*?\]\s*\}/g)].map(x=>score(x[0])).filter(x=>x.valid);active.final={...a,score:score(response),embeddedReportCount:candidates.length,embeddedScore:candidates.length===1?candidates[0]:null,responseLength:response.length}}
           }
           if(e.type==='turn/end'){
             const k=d?.reason?.kind
             active.turnEnds.push(['completed','aborted','error','cancelled','canceled','interrupted','stopped','failed'].includes(k)?k:'unknown')
             active.ended=ts(e)
           }
           }
           function line(s){if(!s.trim())return;try{inspect(JSON.parse(s))}catch{complete=false}}
           function feed(s){pending+=s;let p;while((p=pending.indexOf('\n'))>=0){line(pending.slice(0,p));pending=pending.slice(p+1)}if(pending.length>32*1024*1024){complete=false;pending=''}}
           const starts=[];let pos=0;while((pos=buf.indexOf(magic,pos))>=0){starts.push(pos);pos+=4}
           if(!starts.length)complete=false
           for(let i=0;i<starts.length;i++){try{const frame=zlib.zstdDecompressSync(buf.subarray(starts[i],starts[i+1]??buf.length),{maxOutputLength:32*1024*1024});decoded+=frame.length;if(decoded>128*1024*1024){complete=false;break}feed(frame.toString('utf8'))}catch{complete=false}}
           if(pending.trim())line(pending)
           finish()
           for(const x of found){x.parseComplete=complete;(child?children:matches).push(x)}
           if(!complete)incomplete++
           if(!child&&rank!==null&&rank<=8)recent.push(metadata)
          }
          for(const [i,f] of files.slice(0,20).entries())scan(f,false,i+1)
          const parent=matches.length===1?matches[0]:null
          const ids=new Set(parent?[...parent.childIds,...Array.from(parentRefs).filter(([c,p])=>p===parent.id&&files.some(f=>f.id===c&&f.mtime>=parent.started-5000)).map(([c])=>c)]:[])
          for(const f of files.filter(f=>ids.has(f.id)).slice(0,10))scan(f,true)
          function view(x){return {id:x.id,matchBasis:x.matchBasis??null,started:x.started===null?null:new Date(x.started).toISOString(),ended:x.ended===null?null:new Date(x.ended).toISOString(),parseComplete:x.parseComplete,turnEnds:x.turnEnds,wallMs:x.started!==null&&x.ended!==null?x.ended-x.started:null,toolStarts:x.toolStarts,subagentToolStarts:x.subagentToolStarts,toolNames:x.toolNames,messageToolNames:x.messageToolNames,toolCalls:x.toolCalls,descriptorEvents:x.descriptorEvents,linkedChildCount:x.childIds.size,attempts:x.attempts,final:x.final}}
          out({status:matches.length?'matched':'not-found',archiveCount:files.length,scanned,incomplete,matchCount:matches.length,linkedChildCount:ids.size,childArchivesFound:children.length,parent:parent?view(parent):null,children:children.map(view),promptInfo,internalLog:internalLog.slice(-30),matchBases:matches.map(x=>x.matchBasis),recent,markerHits:markerHits.slice(0,30)})
          '@ | node --input-type=module -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
