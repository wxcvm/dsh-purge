name: DeepSeek native QA entrypoint preflight
on:
  push:
    branches: [robin/read-runtime-usage-once]
permissions:
  contents: read
jobs:
  preflight:
    runs-on: [self-hosted, Windows, X64, purge-ci]
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check existing native CLI help without inference
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import fs from 'node:fs'
          import path from 'node:path'
          import os from 'node:os'
          import {spawnSync} from 'node:child_process'
          const home=process.env.DSH_HOME||path.join(process.env.USERPROFILE||os.homedir(),'.dsh')
          const profiles=['tui','desktop','web','default','codex-review','headless'].filter(p=>fs.existsSync(path.join(home,'profiles',p)))
          const help=[]
          for(const profile of profiles.filter(p=>['tui','desktop','default','codex-review','headless'].includes(p))){
           const r=spawnSync('cmd.exe',['/d','/s','/c','dsh --profile '+profile+' --help'],{encoding:'utf8',timeout:12000,windowsHide:true,maxBuffer:2*1024*1024})
           const lines=(r.stdout||'').split(/\r?\n/).filter(l=>/usage:|commands:|options:|--help|--model|--profile|--preset|--prompt|--json|--print|--output|--session|--agent|--cwd|--non-interactive|--headless|--message|--query|^\s+(?:run|chat|exec|agent|session|help)\b/i.test(l)).map(l=>l.slice(0,220)).slice(0,45)
           help.push({profile,exit:r.status,help:lines})
          }
          console.log('PURGE_NATIVE_PREFLIGHT='+JSON.stringify({profiles,help}))
          '@ | node --input-type=module -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
