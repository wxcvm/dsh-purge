name: Inspect local model and Harness QA entrypoints
on:
  push:
    branches: [robin/read-runtime-usage-once]
permissions:
  contents: read
jobs:
  preflight:
    runs-on: [self-hosted, Windows, X64, purge-ci]
    timeout-minutes: 2
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Inspect available local models and CLI help without inference
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import {spawnSync} from 'node:child_process'
          const check=async url=>{try{const r=await fetch(url,{signal:AbortSignal.timeout(3500),redirect:'error'});return {reachable:true,status:r.status,data:r.ok?await r.json():null}}catch{return {reachable:false,status:null,data:null}}}
          const [ps,tags,lm]=await Promise.all([check('http://127.0.0.1:11434/api/ps'),check('http://127.0.0.1:11434/api/tags'),check('http://127.0.0.1:1234/api/v0/models')])
          const valid=n=>typeof n==='string'&&/^[\w./:@+-]{1,100}$/.test(n)
          const models=(tags.data?.models??[]).filter(m=>valid(m.name)&&!/(?:cloud|embed|rerank)/i.test(m.name)).map(m=>({name:m.name,bytes:Number.isFinite(m.size)?m.size:null}))
          const lms=(lm.data?.data??[]).filter(m=>m.type==='llm'&&valid(m.id)).map(m=>({name:m.id,state:['loaded','not-loaded','unloaded'].includes(m.state)?m.state:'unknown'}))
          const cli=spawnSync('cmd.exe',['/d','/s','/c','dsh --help'],{encoding:'utf8',timeout:12000,windowsHide:true})
          const help=(cli.stdout||'').split(/\r?\n/).filter(l=>/usage:|commands:|options:|--help|--model|--profile|--preset|--prompt|--json|--print|--output|--session|--agent|--cwd|--non-interactive|^\s+(?:run|chat|exec|agent|session|help)\b/i.test(l)).map(l=>l.slice(0,250)).slice(0,35)
          console.log('PURGE_PREFLIGHT_RESULT='+JSON.stringify({ollama:{ps:ps.reachable,status:ps.status,tags:tags.reachable,tagsStatus:tags.status,installed:models},lmStudio:{reachable:lm.reachable,status:lm.status,installed:lms},harness:{helpExit:cli.status,help}}))
          '@ | node --input-type=module -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
