name: Locate active Desktop QA interface
on:
  push:
    branches: [robin/read-runtime-usage-once]
permissions:
  contents: read
jobs:
  preflight:
    runs-on: [self-hosted, Windows, X64, purge-ci]
    timeout-minutes: 2
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Read local interface and package metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import fs from 'node:fs'
          import path from 'node:path'
          import os from 'node:os'
          import {spawnSync} from 'node:child_process'
          const home=process.env.DSH_HOME||path.join(process.env.USERPROFILE||os.homedir(),'.dsh')
          const check=async port=>{try{const r=await fetch('http://127.0.0.1:'+port+'/dsh-purge/runtime-observations?limit=1',{signal:AbortSignal.timeout(2500),redirect:'error'});let v=null;try{v=await r.json()}catch{};return {port,status:r.status,schema:v?.schemaVersion??null,rows:Array.isArray(v?.items)?v.items.length:null,latest:v?.items?.slice(0,1).map(x=>({provider:/^[\w.-]{1,80}$/.test(x.provider||'')?x.provider:null,model:/^[\w./:-]{1,100}$/.test(x.model||'')?x.model:null}))??null}}catch{return {port,reachable:false}}}
          const ports=await Promise.all([43120,43121,3080].map(check))
          const info=[]
          for(const profile of ['headless','desktop','default']){
           const d=path.join(home,'profiles',profile)
           for(const n of ['cordis.yml','cordis.patch.yml','package.json']){
            try{const s=fs.readFileSync(path.join(d,n),'utf8')
             const lines=s.split(/\r?\n/).filter(l=>/^\s*(?:- )?(?:name|id):\s*['"]?@deepseek-ai\/dsh-(?:headless|web-app|cli|model|llm|session|agent)[\w/-]*['"]?\s*$/.test(l)).map(l=>l.trim()).slice(0,30)
             let pkg=[];if(n==='package.json'){const x=JSON.parse(s);pkg=Object.keys({...x.dependencies,...x.devDependencies}).filter(k=>/^@deepseek-ai\/dsh/.test(k))}
             info.push({profile,file:n,plugins:lines,packages:pkg})
            }catch{}
           }
          }
          const base=path.join(home,'profiles','headless','node_modules','@deepseek-ai')
          let packages=[];try{packages=fs.readdirSync(base).filter(n=>/^dsh(?:-headless|-cli|-web|-agent|-session|$)/.test(n))}catch{}
          console.log('PURGE_DESKTOP_CHECK='+JSON.stringify({ports,profiles:info,headlessPackages:packages}))
          '@ | node --input-type=module -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
