name: Replay known synthetic QA archive
on:
  push:
    branches: [robin/read-runtime-usage-once]
permissions:
  contents: read
jobs:
  read:
    if: github.repository == 'wxcvm/dsh-purge' && github.ref == 'refs/heads/robin/read-runtime-usage-once'
    runs-on: [self-hosted, Windows, X64, purge-ci]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7e5c6b3f93574f24d7b59a5ce0d1b1f788e2926f
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Replay two known synthetic QA archives
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import fs from 'node:fs'
          import path from 'node:path'
          import os from 'node:os'
          import { decodeArchive, archiveEvents, extractMarkedTurn } from './scripts/review-trace-import.mjs'
          const root=path.join(process.env.DSH_HOME||path.join(process.env.USERPROFILE||os.homedir(),'.dsh'),'sessions')
          const target=['session-06749b0b-8bc3-4359-ba8e-0218c84f7931','f8c9cad8-6988-4285-a5ce-bef1570d39e5']
          const find=id=>{
            const candidates=[]
            for(const d of fs.readdirSync(root,{withFileTypes:true})){
              if(!d.isDirectory()||d.isSymbolicLink())continue
              const dir=path.join(root,d.name,id)
              try{const stat=fs.lstatSync(dir);if(!stat.isDirectory()||stat.isSymbolicLink())continue;const file=path.join(dir,'session.v4.jsonl.zstd');const st=fs.lstatSync(file);if(st.isFile()&&!st.isSymbolicLink())candidates.push(file)}catch{}
            }
            if(candidates.length!==1)throw new Error('Archive not uniquely available')
            return decodeArchive(fs.readFileSync(candidates[0]))
          }
          const result={}
          for(let i=0;i<target.length;i++){
           try{
            const records=find(target[i]);const {events,parentRefs}=archiveEvents(records)
            const row={decoded:true,eventCount:events.length,parentLink:i===1?parentRefs.includes(target[0]):null}
            if(i===0){
             try{
              const trace=extractMarkedTurn(records,'PURGE-DS41-DELEGATE-02')
              row.turn=trace.turn;row.lifecycle=trace.lifecycle;row.elapsedMs=trace.elapsedMs;row.modelResponses=trace.attempts.length;row.route=trace.route;row.linkedChild=trace.childIds.includes(target[1]);row.totalTokens=trace.attempts.every(a=>typeof a.totalTokens==='number')?trace.attempts.reduce((s,a)=>s+a.totalTokens,0):null;row.toolStarts=trace.attempts.every(a=>typeof a.toolStarts==='number')?trace.attempts.reduce((s,a)=>s+a.toolStarts,0):null
             }catch(e){
              row.extractionError=['QA marker must identify exactly one request; supply userSeq if repeated','Marked request does not identify one native turn','Conflicting turn endings','Additional turn events after end'].includes(e.message)?e.message:'unclassified'
              const hits=events.filter(x=>x.type==='user/message'&&JSON.stringify(x.data).includes('PURGE-DS41-DELEGATE-02'))
              row.markerUserEvents=hits.length
              if(hits.length===1){const s=hits[0].seq;const later=events.filter(x=>x.seq>s&&['turn/start','turn/end','assistant/message','assistant/attempt'].includes(x.type));row.turnShapes=later.slice(0,30).map(x=>({type:x.type,turn:Number.isSafeInteger(x.data?.turn)?x.data.turn:null,reason:x.type==='turn/end'?x.data?.reason?.kind:null}))}
             }
            }
            result[i===0?'parent':'child']=row
           }catch{result[i===0?'parent':'child']={decoded:false}}
          }
          console.log('PURGE_QA_ARCHIVE_SMOKE='+JSON.stringify(result))
          '@ | node --input-type=module -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
