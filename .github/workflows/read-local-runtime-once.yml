name: Compare Qwen with structured QA output
on:
  push:
    branches: [robin/read-runtime-usage-once]
permissions:
  contents: read
jobs:
  compare:
    if: github.repository == 'wxcvm/dsh-purge' && github.ref == 'refs/heads/robin/read-runtime-usage-once'
    runs-on: [self-hosted, Windows, X64, purge-ci]
    timeout-minutes: 6
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check loaded local models and compare fictional QA answers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import {performance} from 'node:perf_hooks'
          import {spawnSync} from 'node:child_process'
          const out=x=>console.log('PURGE_QA_RESULT='+JSON.stringify(x))
          const get=async url=>{try{const r=await fetch(url,{signal:AbortSignal.timeout(3000),redirect:'error'});return r.ok?await r.json():null}catch{return null}}
          const ollama=await get('http://127.0.0.1:11434/api/ps')
          const lm=await get('http://127.0.0.1:1234/api/v0/models')
          const loadedO=(ollama?.models??[]).filter(m=>typeof m.name==='string'&&!/embed|rerank/i.test(m.name))
          const loadedL=(lm?.data??[]).filter(m=>m.type==='llm'&&m.id==='qwen2.5-3b')
          const cli=spawnSync('where.exe',['dsh'],{encoding:'utf8',timeout:3000,windowsHide:true})
          const preflight={ollamaLoaded:loadedO.length,lmStudioLoaded:loadedL.length,harnessCliOnPath:cli.status===0}
          const selected=loadedL.length?{server:'lm-studio',model:loadedL[0].id,url:'http://127.0.0.1:1234/v1/chat/completions'}:null
          if(!selected){out({status:'qwen-model-not-listed',preflight});process.exit(0)}
          const cases=[
          {id:'a1',goal:'Check current calculator build B2 addition test',lifecycle:'completed',record:'Worker reported completion; no executed test or result recorded.'},
          {id:'a2',goal:'Check current calculator build B2 addition test',lifecycle:'completed',record:'Addition test executed on B2 and passed.'},
          {id:'b1',goal:'Check current documentation revision R7 links',lifecycle:'completed',record:'Link check passed on R6; no test of R7.'},
          {id:'b2',goal:'Check current documentation revision R7 links',lifecycle:'completed',record:'Link check executed on R7 and failed.'}
          ]
          const key={a1:'unverified',a2:'verified',b1:'unverified',b2:'contradicted'}
          const schema={type:'object',properties:{reports:{type:'array',minItems:4,maxItems:4,items:{type:'object',properties:{id:{type:'string',enum:['a1','a2','b1','b2']},lifecycle:{type:'string',enum:['completed','aborted','error','unknown']},outcome:{type:'string',enum:['verified','unverified','contradicted']}},required:['id','lifecycle','outcome'],additionalProperties:false}}},required:['reports'],additionalProperties:false}
          const responseFormat={type:'json_schema',json_schema:{name:'qa_reports',strict:true,schema}}
          const packet=JSON.stringify(cases)
          const instruction='Evaluate fictional local software QA records. Do not use tools. Host lifecycle and verified result are independent. For each case output JSON only: {"reports":[{"id":"a1","lifecycle":"completed","outcome":"verified|unverified|contradicted"}]}. verified means matching check passed; contradicted means matching check failed; unverified means no matching check result. Use all case ids. '
          function score(text){
           let x;try{x=JSON.parse(text.trim())}catch{return {valid:false,passed:0,total:4}}
           if(!Array.isArray(x.reports))return {valid:false,passed:0,total:4}
           const ids=new Set(x.reports.map(r=>r?.id))
           if(x.reports.length!==4||ids.size!==4||Object.keys(key).some(k=>!ids.has(k)))return {valid:false,passed:0,total:4}
           return {valid:true,passed:x.reports.filter(r=>r.lifecycle==='completed'&&r.outcome===key[r.id]).length,total:4,outcomes:x.reports.map(r=>({id:r.id,lifecycle:['completed','aborted','error','unknown'].includes(r.lifecycle)?r.lifecycle:'invalid',outcome:['verified','unverified','contradicted'].includes(r.outcome)?r.outcome:'invalid'}))}
          }
          async function run(prompt){
           const start=performance.now(),messages=[{role:'user',content:prompt}],isO=selected.server==='ollama'
           const body=isO?{model:selected.model,messages,stream:false,options:{temperature:0,num_predict:512}}:{model:selected.model,messages,stream:false,temperature:0,max_tokens:512,response_format:responseFormat}
           try{
            const r=await fetch(selected.url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:AbortSignal.timeout(90000),redirect:'error'})
            if(!r.ok)return {status:'http-error',httpStatus:r.status,elapsedMs:Math.round(performance.now()-start)}
            const v=await r.json(),text=isO?v.message?.content:v.choices?.[0]?.message?.content
            const measured=x=>typeof x==='number'&&Number.isFinite(x)&&x>=0?x:null
            const reason=isO?v.done_reason:v.choices?.[0]?.finish_reason
            return {status:typeof text==='string'?'ok':'missing-response',text:typeof text==='string'?text:'',elapsedMs:Math.round(performance.now()-start),inputTokens:measured(isO?v.prompt_eval_count:v.usage?.prompt_tokens),outputTokens:measured(isO?v.eval_count:v.usage?.completion_tokens),finish:['stop','length'].includes(reason)?reason:'unknown'}
           }catch{return {status:'request-failed',elapsedMs:Math.round(performance.now()-start)}}
          }
          const direct=await run(instruction+packet)
          const worker=await run(instruction+packet)
          const judge=worker.status==='ok'?await run(instruction+packet+'\nReview the prior candidate against the original records. Correct mistakes; do not blindly accept it. Candidate:\n'+worker.text.slice(0,6000)):null
          const publicResult=r=>r?{status:r.status,elapsedMs:r.elapsedMs,inputTokens:r.inputTokens??null,outputTokens:r.outputTokens??null,finish:r.finish??null,httpStatus:r.httpStatus??null,score:r.status==='ok'?score(r.text):null}:null
          out({status:'completed-local-smoke',preflight,server:selected.server,model:/^[\w./:@+-]{1,100}$/.test(selected.model)?selected.model:'local-model',direct:publicResult(direct),worker:publicResult(worker),judge:publicResult(judge),scope:'structured-local-model-direct-vs-two-stage-review-not-native-harness'})
          '@ | node --input-type=module -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
