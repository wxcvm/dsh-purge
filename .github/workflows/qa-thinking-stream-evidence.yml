name: QA DeepSeek MAX CLI interface probe
on:
  push:
    branches: [robin/qa-thinking-stream-evidence-20261116]
permissions:
  contents: read
jobs:
  evidence:
    runs-on: [self-hosted, Windows]
    timeout-minutes: 3
    steps:
      - name: Inspect existing headless model controls
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          & dsh headless --help 2>&1 | Select-Object -First 130
          Write-Host "dsh-exit=$LASTEXITCODE"
