name: QA Desktop Open New Conversation
on:
  pull_request:
    types: [synchronize]
permissions:
  contents: read
jobs:
  open:
    if: github.head_ref == 'robin/qa-headless-paired-retry-20261116'
    runs-on: [self-hosted, Windows]
    timeout-minutes: 3
    steps:
      - name: Open a fresh Harness conversation and identify its composer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          $session = (Get-Process -Id $PID).SessionId
          $windows = @(Get-Process -ErrorAction SilentlyContinue | Where-Object { $_.ProcessName -like '*DeepSeek*Harness*' -and $_.SessionId -eq $session -and $_.MainWindowHandle -ne 0 })
          if ($windows.Count -ne 1) { throw "Expected one Harness window in the Runner desktop" }
          $handle = $windows[0].MainWindowHandle
          function Get-Controls {
            $root = [System.Windows.Automation.AutomationElement]::FromHandle($handle)
            $root.FindAll([System.Windows.Automation.TreeScope]::Descendants, [System.Windows.Automation.Condition]::TrueCondition)
          }
          function Get-Pattern($element,$pattern) {
            $obj = $null
            if ($element.TryGetCurrentPattern($pattern,[ref]$obj)) { return $obj }
            return $null
          }
          $before = @(Get-Controls)
          $buttons = @($before | Where-Object {
            try { $_.Current.ControlType -eq [System.Windows.Automation.ControlType]::Button -and $_.Current.Name -in @('新建会话','新建对话','New Chat','New Conversation','New Session') -and $_.Current.IsEnabled -and -not $_.Current.IsOffscreen -and $_.Current.BoundingRectangle.Width -gt 0 -and $_.Current.BoundingRectangle.Height -gt 0 } catch { $false }
          })
          $invokable = @($buttons | Where-Object { $null -ne (Get-Pattern $_ ([System.Windows.Automation.InvokePattern]::Pattern)) })
          [ordered]@{ stage='new-chat-control'; visibleButtons=$buttons.Count; invokableButtons=$invokable.Count } | ConvertTo-Json -Compress
          if ($invokable.Count -eq 0) { throw 'No accessible New Chat InvokePattern; no UI action taken' }
          # Both matching buttons are labelled exactly New Chat; either opens a fresh conversation.
          $action = Get-Pattern $invokable[0] ([System.Windows.Automation.InvokePattern]::Pattern)
          $action.Invoke()
          Start-Sleep -Milliseconds 1800
          $after = @(Get-Controls)
          $known = @()
          $editors = @()
          foreach ($c in $after) {
            try {
              $v = $c.Current
              if ($v.IsOffscreen -or -not $v.IsEnabled -or $v.BoundingRectangle.Width -le 0 -or $v.BoundingRectangle.Height -le 0) { continue }
              $type = $v.ControlType.ProgrammaticName
              $name = $v.Name
              $rect = $v.BoundingRectangle
              $patterns = @($c.GetSupportedPatterns() | ForEach-Object { $_.ProgrammaticName })
              if ($type -in @('ControlType.Edit','ControlType.Document') -and $v.IsKeyboardFocusable) {
                # Do not read editable text or document contents.
                $editors += [ordered]@{ type=$type; automationId=$v.AutomationId; class=$v.ClassName; focused=$v.HasKeyboardFocus; patterns=$patterns; width=[int]$rect.Width; height=[int]$rect.Height }
              }
              if ($name -match '^(新建(对话|会话|聊天)?|New (Chat|Conversation|Session)|发送|Send|Redteam|红队(模式)?|Max|完全权限|Full access|DeepSeek( V4\.1)? Flash|多智能体协作|标准|Standard|打开工作区|Open workspace|Select workspace|选择工作区|开始对话|Ask anything|停止|Stop|停止生成)([ .…:：]+.*)?$' -and $type -in @('ControlType.Button','ControlType.MenuItem','ControlType.TabItem','ControlType.ComboBox','ControlType.Text')) {
                $known += [ordered]@{ type=$type; name=($name -split '[\r\n]')[0].Substring(0,[Math]::Min($name.Length,80)); patterns=$patterns; enabled=$v.IsEnabled }
              }
            } catch {}
          }
          [ordered]@{ stage='new-conversation-opened'; controls=$after.Count; editorCandidates=$editors; knownControls=$known; modelRequests=0; taskSubmitted=$false } | ConvertTo-Json -Depth 6 -Compress
