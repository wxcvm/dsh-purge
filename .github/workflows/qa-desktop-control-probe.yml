name: QA Desktop Verified Focus Interaction
on:
  pull_request:
    types: [synchronize]
permissions:
  contents: read
jobs:
  direct:
    if: github.head_ref == 'robin/qa-headless-paired-retry-20261116'
    runs-on: [self-hosted, Windows]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify fresh Desktop composer and submit direct QA only when confirmed
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          $session = (Get-Process -Id $PID).SessionId
          $windows = @(Get-Process -ErrorAction SilentlyContinue | Where-Object { $_.ProcessName -like '*DeepSeek*Harness*' -and $_.SessionId -eq $session -and $_.MainWindowHandle -ne 0 })
          if ($windows.Count -ne 1) { throw 'Expected exactly one accessible Harness window' }
          $handle = $windows[0].MainWindowHandle
          function Get-Controls {
            $root = [System.Windows.Automation.AutomationElement]::FromHandle($handle)
            $root.FindAll([System.Windows.Automation.TreeScope]::Descendants, [System.Windows.Automation.Condition]::TrueCondition)
          }
          function Get-Pattern($element,$pattern) {
            $obj = $null
            if ($element.TryGetCurrentPattern($pattern,[ref]$obj)) { return $obj }
            return $null
          }
          function Is-Visible($c) {
            try { return ($c.Current.IsEnabled -and -not $c.Current.IsOffscreen -and $c.Current.BoundingRectangle.Width -gt 0 -and $c.Current.BoundingRectangle.Height -gt 0) } catch { return $false }
          }
          function Get-Composer {
            @(Get-Controls | Where-Object {
              try { (Is-Visible $_) -and $_.Current.ControlType -eq [System.Windows.Automation.ControlType]::Edit -and $_.Current.ClassName -eq 'GRgSLq_input' } catch { $false }
            })
          }
          # Open a fresh conversation in this same invocation.
          $new = @(Get-Controls | Where-Object {try {(Is-Visible $_) -and $_.Current.ControlType -eq [System.Windows.Automation.ControlType]::Button -and $_.Current.Name -in @('新建会话','新建对话','New Chat','New Conversation','New Session') -and $null -ne (Get-Pattern $_ ([System.Windows.Automation.InvokePattern]::Pattern))}catch{$false}})
          if($new.Count -eq 0){throw 'New Chat unavailable'}
          (Get-Pattern $new[0] ([System.Windows.Automation.InvokePattern]::Pattern)).Invoke()
          Start-Sleep -Milliseconds 1200
          $editor = @(Get-Composer)
          if ($editor.Count -ne 1) { throw 'Expected the identified Harness composer' }
          $vp = Get-Pattern $editor[0] ([System.Windows.Automation.ValuePattern]::Pattern)
          if ($null -eq $vp -or $vp.Current.IsReadOnly) { throw 'Composer cannot be written via ValuePattern' }
          if (-not [string]::IsNullOrWhiteSpace($vp.Current.Value)) {
            [ordered]@{stage='composer';status='not-empty';taskSubmitted=$false} | ConvertTo-Json -Compress
            return
          }
          $rect = $editor[0].Current.BoundingRectangle
          # Chromium's accessibility ExpandCollapse may report success without
          # making the DOM menu visible. Inspect the actual labelled control;
          # click only its verified hit point if Expand did not expose options.
          Add-Type -AssemblyName WindowsBase
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class QaDesktopMouse {
            [DllImport("user32.dll")] public static extern IntPtr GetForegroundWindow();
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h);
            [DllImport("user32.dll")] public static extern IntPtr GetAncestor(IntPtr h,uint flags);
            [DllImport("user32.dll")] public static extern bool IsIconic(IntPtr h);
            [DllImport("user32.dll")] public static extern bool ShowWindowAsync(IntPtr h,int cmd);
            [DllImport("user32.dll")] public static extern void keybd_event(byte key,byte scan,uint flags,UIntPtr extra);
            [StructLayout(LayoutKind.Sequential)] public struct Point { public int X; public int Y; public Point(int x,int y){X=x;Y=y;} }
            [DllImport("user32.dll")] public static extern IntPtr WindowFromPoint(Point p);
            [DllImport("user32.dll")] public static extern bool SetCursorPos(int x,int y);
            [DllImport("user32.dll")] public static extern void mouse_event(uint flags,uint x,uint y,uint data,UIntPtr extra);
          }
          '@
          function Same-Element($a,$b) {
            if($null -eq $a -or $null -eq $b){return $false}
            try { return (($a.GetRuntimeId() -join ',') -eq ($b.GetRuntimeId() -join ',')) } catch { return $false }
          }
          function Is-DescendantOrSelf($node,$target) {
            $walker=[System.Windows.Automation.TreeWalker]::RawViewWalker
            for($j=0;$j -lt 24 -and $null -ne $node;$j++){
              if(Same-Element $node $target){return $true}
              try{$node=$walker.GetParent($node)}catch{break}
            }
            return $false
          }
          function App-Foreground {
            $fg=[QaDesktopMouse]::GetForegroundWindow()
            return ($fg -ne [IntPtr]::Zero -and [QaDesktopMouse]::GetAncestor($fg,2) -eq [QaDesktopMouse]::GetAncestor($handle,2))
          }
          function Focus-Verified($element) {
            if(-not (Is-Visible $element)){return $false}
            if([QaDesktopMouse]::IsIconic($handle)){[void][QaDesktopMouse]::ShowWindowAsync($handle,9);Start-Sleep -Milliseconds 300}
            try{$element.SetFocus()}catch{}
            if(-not (App-Foreground)){[void][QaDesktopMouse]::SetForegroundWindow($handle);Start-Sleep -Milliseconds 350}
            try{$element.SetFocus()}catch{}
            Start-Sleep -Milliseconds 180
            $focused=$false
            try{$focused=(Is-DescendantOrSelf ([System.Windows.Automation.AutomationElement]::FocusedElement) $element) -or $element.Current.HasKeyboardFocus}catch{}
            [ordered]@{stage='focus-verification';foreground=(App-Foreground);targetFocused=$focused;class=$element.Current.ClassName}|ConvertTo-Json -Compress|Write-Host
            return ((App-Foreground) -and $focused)
          }
          function Open-Verified($element) {
            if(-not (Focus-Verified $element)){return $false}
            # Only deliver Enter when the exact intended control owns focus and
            # the foreground root is the authorized Harness window.
            [QaDesktopMouse]::keybd_event(13,0,0,[UIntPtr]::Zero)
            [QaDesktopMouse]::keybd_event(13,0,2,[UIntPtr]::Zero)
            return $true
          }
          function Click-Verified($element) {
            if (-not (Is-Visible $element)) { return $false }
            if(-not (App-Foreground)){try{$element.SetFocus()}catch{};[void][QaDesktopMouse]::SetForegroundWindow($handle);Start-Sleep -Milliseconds 250}
            $b=$element.Current.BoundingRectangle
            $x=[int]($b.Left+$b.Width/2);$y=[int]($b.Top+$b.Height/2)
            $nativeHit=[QaDesktopMouse]::WindowFromPoint([QaDesktopMouse+Point]::new($x,$y))
            $windowMatched=($nativeHit -ne [IntPtr]::Zero -and [QaDesktopMouse]::GetAncestor($nativeHit,2) -eq [QaDesktopMouse]::GetAncestor($handle,2))
            $hitMatched=$false
            try{$hit=[System.Windows.Automation.AutomationElement]::FromPoint([System.Windows.Point]::new($x,$y));$hitMatched=Is-DescendantOrSelf $hit $element}catch{}
            [ordered]@{stage='click-verification';foreground=(App-Foreground);windowMatched=$windowMatched;targetMatched=$hitMatched;class=$element.Current.ClassName}|ConvertTo-Json -Compress|Write-Host
            if(-not (App-Foreground) -or -not $windowMatched -or -not $hitMatched){return $false}
            [void][QaDesktopMouse]::SetCursorPos($x,$y)
            [QaDesktopMouse]::mouse_event(2,0,0,0,[UIntPtr]::Zero)
            [QaDesktopMouse]::mouse_event(4,0,0,0,[UIntPtr]::Zero)
            return $true
          }
          function Get-Labelled($pattern) {
            @(Get-Controls | Where-Object {
              try {
                -not $_.Current.IsOffscreen -and $_.Current.BoundingRectangle.Width -gt 0 -and
                $_.Current.BoundingRectangle.Height -gt 0 -and $_.Current.Name -match $pattern -and
                $_.Current.ControlType.ProgrammaticName -ne 'ControlType.Document'
              }catch{$false}
            })
          }
          function Describe-Labels($elements,$kind) {
            @($elements | ForEach-Object {
              $v=$_.Current
              $n=[string]$v.Name
              $toggle=Get-Pattern $_ ([System.Windows.Automation.TogglePattern]::Pattern)
              $selection=Get-Pattern $_ ([System.Windows.Automation.SelectionItemPattern]::Pattern)
              [ordered]@{type=$v.ControlType.ProgrammaticName;class=$v.ClassName;label=($n -split '[\r\n]')[0].Substring(0,[Math]::Min(120,($n -split '[\r\n]')[0].Length));enabled=$v.IsEnabled;toggle=if($null -ne $toggle){[string]$toggle.Current.ToggleState}else{$null};selected=if($null -ne $selection){$selection.Current.IsSelected}else{$null};patterns=@($_.GetSupportedPatterns()|ForEach-Object{$_.ProgrammaticName})}
            })
          }
          $modeSelected=$false
          $pickers=@(Get-Controls | Where-Object {
            try{(Is-Visible $_) -and $_.Current.ClassName -eq 'm2hUqa_seat' -and $_.Current.ControlType -eq [System.Windows.Automation.ControlType]::Button}catch{$false}
          })
          $redPattern='(?i)^(?:红队(?:模式)?|red\s*team(?:\s*mode)?)(?:$|[\s：:，,（(—-])'
          if($pickers.Count -eq 1){
            $picker=$pickers[0]
            if($picker.Current.Name -match $redPattern){$modeSelected=$true}
            else{
              $exp=Get-Pattern $picker ([System.Windows.Automation.ExpandCollapsePattern]::Pattern)
              if($null -ne $exp){try{$exp.Expand()}catch{}}
              Start-Sleep -Milliseconds 700
              $red=@(Get-Labelled $redPattern)
              if($red.Count -eq 0){
                $clicked=Open-Verified $picker
                if(-not $clicked){$clicked=Click-Verified $picker}
                Start-Sleep -Milliseconds 700
                $red=@(Get-Labelled $redPattern)
                [ordered]@{stage='preset-menu-click';clicked=$clicked;redCandidates=$red.Count}|ConvertTo-Json -Compress
              }
              $menu=@(Get-Labelled '(?i)^(?:红队|red\s*team|标准模式|standard mode|多智能体|multi.agent)')
              [ordered]@{stage='preset-menu';options=(Describe-Labels $menu 'preset')}|ConvertTo-Json -Depth 6 -Compress
              $actionable=@($red|Where-Object{try{(Is-Visible $_) -and $_.Current.ControlType.ProgrammaticName -in @('ControlType.Button','ControlType.MenuItem','ControlType.ListItem','ControlType.RadioButton','ControlType.Custom','ControlType.DataItem') -and ($null -ne (Get-Pattern $_ ([System.Windows.Automation.InvokePattern]::Pattern)) -or $null -ne (Get-Pattern $_ ([System.Windows.Automation.SelectionItemPattern]::Pattern)))}catch{$false}})
              if($actionable.Count -eq 1){
                $inv=Get-Pattern $actionable[0] ([System.Windows.Automation.InvokePattern]::Pattern)
                if($null -ne $inv){$inv.Invoke()}else{(Get-Pattern $actionable[0] ([System.Windows.Automation.SelectionItemPattern]::Pattern)).Select()}
              }elseif($red.Count -eq 1 -and (Is-Visible $red[0])){
                [void](Click-Verified $red[0])
              }
              Start-Sleep -Milliseconds 700
              $current=@(Get-Controls|Where-Object{try{(Is-Visible $_) -and $_.Current.ClassName -eq 'm2hUqa_seat' -and $_.Current.Name -match $redPattern}catch{$false}})
              $modeSelected=($current.Count -eq 1)
              if(-not $modeSelected -and $null -ne $exp){try{$exp.Collapse()}catch{}}
            }
          }
          [ordered]@{stage='preset-picker';candidateCount=$pickers.Count;redteamVerified=$modeSelected}|ConvertTo-Json -Compress
          # Model menu contains the native multi-agent collaboration toggle.
          # Only observe it here; no change to the user's saved preferences.
          $modelPicker=@(Get-Controls|Where-Object{try{(Is-Visible $_) -and $_.Current.ClassName -eq '_9r0rkG_trigger' -and $_.Current.Name -match '(?i)deepseek.*flash.*max'}catch{$false}})
          $collaborationVerified=$false
          if($modelPicker.Count -eq 1){
            $mp=$modelPicker[0]
            $mx=Get-Pattern $mp ([System.Windows.Automation.ExpandCollapsePattern]::Pattern)
            if($null -ne $mx){try{$mx.Expand()}catch{}}
            Start-Sleep -Milliseconds 600
            $collabPattern='(?i)^(?:多智能体|multi[\s-]*agent|协作模式|collaboration)'
            $collab=@(Get-Labelled $collabPattern)
            if($collab.Count -eq 0){
              $clicked=Open-Verified $mp
              if(-not $clicked){$clicked=Click-Verified $mp}
              Start-Sleep -Milliseconds 600
              $collab=@(Get-Labelled $collabPattern)
              [ordered]@{stage='model-menu-click';clicked=$clicked;collaborationCandidates=$collab.Count}|ConvertTo-Json -Compress
            }
            $menu=@(Get-Labelled '(?i)^(?:多智能体|multi[\s-]*agent|协作模式|collaboration|Max(?:$|\s|[（(])|High(?:$|\s|[（(])|推理等级|reasoning)')
            $described=@(Describe-Labels $menu 'model')
            foreach($c in $collab){
              $toggle=Get-Pattern $c ([System.Windows.Automation.TogglePattern]::Pattern)
              $selection=Get-Pattern $c ([System.Windows.Automation.SelectionItemPattern]::Pattern)
              if(($null -ne $toggle -and $toggle.Current.ToggleState -eq [System.Windows.Automation.ToggleState]::On) -or ($null -ne $selection -and $selection.Current.IsSelected) -or $c.Current.Name -match '(?i)(已开启|已启用|已打开|enabled|on$)'){$collaborationVerified=$true}
            }
            [ordered]@{stage='model-menu';collaborationVerified=$collaborationVerified;options=$described}|ConvertTo-Json -Depth 6 -Compress
            if($null -ne $mx){try{$mx.Collapse()}catch{}}
          }
          if(-not $modeSelected -or -not $collaborationVerified){
            [ordered]@{stage='direct-submit';status='mode-or-collaboration-not-verified';redteamVerified=$modeSelected;collaborationVerified=$collaborationVerified;taskSubmitted=$false}|ConvertTo-Json -Compress
            return
          }
          $editor=@(Get-Composer)
          if($editor.Count -ne 1){throw 'Composer unavailable after preset selection'}
          $vp=Get-Pattern $editor[0] ([System.Windows.Automation.ValuePattern]::Pattern)
          if($null -eq $vp -or $vp.Current.IsReadOnly -or -not [string]::IsNullOrWhiteSpace($vp.Current.Value)){throw 'Fresh composer is not empty and writable'}
          $rect=$editor[0].Current.BoundingRectangle
          $toolbar = @()
          $labels = @()
          $candidates = @()
          $known = '(?i)deepseek|flash|红队|redteam|max|完全权限|full.access|danger.full.access|多智能体|multi.agent|standard|标准|模式|model|模型|权限|permission|发送|send|推理|reasoning|协作|attach|附件|停止|stop|工作区|workspace'
          foreach ($c in (Get-Controls)) {
            try {
              if (-not (Is-Visible $c)) { continue }
              $v=$c.Current
              $t=$v.ControlType.ProgrammaticName
              $b=$v.BoundingRectangle
              if ($t -notin @('ControlType.Button','ControlType.ComboBox','ControlType.Text','ControlType.CheckBox','ControlType.MenuItem','ControlType.ToggleButton')) { continue }
              if ($b.Left -lt ($rect.Left-90) -or $b.Right -gt ($rect.Right+90) -or $b.Top -lt ($rect.Top-150) -or $b.Bottom -gt ($rect.Bottom+230)) { continue }
              $n=[string]$v.Name
              if ($n -match $known) {
                $safeName=($n -split '[\r\n]')[0]
                if ($safeName.Length -gt 100) { $safeName=$safeName.Substring(0,100) }
                $labels += $safeName
                $candidates += [ordered]@{type=$t;name=$safeName;class=$v.ClassName;patterns=@($c.GetSupportedPatterns() | ForEach-Object {$_.ProgrammaticName})}
              }
              if ($t -ne 'ControlType.Text') {
                $toolbar += [ordered]@{type=$t;class=$v.ClassName;knownName=($n -match $known);named=($n.Length -gt 0);x=[int]($b.Left-$rect.Left);y=[int]($b.Top-$rect.Top);width=[int]$b.Width;height=[int]$b.Height;patterns=@($c.GetSupportedPatterns() | ForEach-Object {$_.ProgrammaticName})}
              }
            } catch {}
          }
          $settings = [ordered]@{
            model=(@($labels | Where-Object {$_ -match '(?i)deepseek.*flash|flash.*deepseek'}).Count -gt 0)
            max=(@($labels | Where-Object {$_ -match '(?i)(?:^|[^a-z])max(?:$|[^a-z])'}).Count -gt 0)
            redteam=(@($labels | Where-Object {$_ -match '(?i)红队|red\s*team'}).Count -gt 0)
            fullAccess=(@($labels | Where-Object {$_ -match '(?i)完全权限|full.access|danger.full.access'}).Count -gt 0)
            collaborationVisible=(@($labels | Where-Object {$_ -match '(?i)多智能体|multi.agent'}).Count -gt 0)
          }
          [ordered]@{stage='composer-settings';editorEmpty=$true;settings=$settings;settingsControls=$candidates;toolbar=$toolbar} | ConvertTo-Json -Depth 7 -Compress
          if (-not ($settings.model -and $settings.max -and ($settings.redteam -or $modeSelected) -and $settings.fullAccess)) {
            [ordered]@{stage='direct-submit';status='settings-not-yet-confirmed';taskSubmitted=$false} | ConvertTo-Json -Compress
            return
          }
          $packet = ((& node (Join-Path $env:GITHUB_WORKSPACE 'scripts/review-trace-import.mjs') --packet 'DS41-DESKTOP-20261116-DIRECT-01' direct) -join [char]10).TrimEnd()
          if ($LASTEXITCODE -ne 0 -or -not $packet.StartsWith('PURGE-QA-RUN: DS41-DESKTOP-20261116-DIRECT-01') -or $packet.Length -lt 3000) { throw 'Could not generate the exact QA packet' }
          $vp.SetValue($packet)
          Start-Sleep -Milliseconds 400
          $editor = @(Get-Composer)
          if ($editor.Count -ne 1) { throw 'Composer changed while entering task; nothing submitted' }
          $vp = Get-Pattern $editor[0] ([System.Windows.Automation.ValuePattern]::Pattern)
          if (($vp.Current.Value -replace '\r\n',[string][char]10).TrimEnd() -ne $packet) { throw 'Composer text did not match the QA packet; nothing submitted' }
          $send = @(Get-Controls | Where-Object {
            try {
              (Is-Visible $_) -and $_.Current.ControlType -eq [System.Windows.Automation.ControlType]::Button -and $_.Current.Name -match '^(发送(?:消息)?|Send(?: message)?)(?:\s*\([^)]*\))?$' -and $null -ne (Get-Pattern $_ ([System.Windows.Automation.InvokePattern]::Pattern))
            } catch { $false }
          })
          if ($send.Count -ne 1) {
            [ordered]@{stage='direct-submit';status='draft-entered-send-control-not-unique';sendCandidates=$send.Count;taskSubmitted=$false} | ConvertTo-Json -Compress
            return
          }
          (Get-Pattern $send[0] ([System.Windows.Automation.InvokePattern]::Pattern)).Invoke()
          Start-Sleep -Milliseconds 1200
          [ordered]@{stage='direct-submit';status='send-invoked';runId='DS41-DESKTOP-20261116-DIRECT-01';taskSubmitted=$true;modelCompletionVerified=$false} | ConvertTo-Json -Compress
