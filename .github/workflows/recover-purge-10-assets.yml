name: Recover Purge .10 Release assets

# One-time recovery for the release whose original runner lost GitHub API TLS.
# This branch intentionally does not match the normal release/v* publish trigger.
on:
  push:
    branches: ["release-assets/v1.1.92-wxcvm.10"]

permissions:
  contents: write

jobs:
  upload:
    if: github.repository == 'wxcvm/dsh-purge' && github.ref == 'refs/heads/release-assets/v1.1.92-wxcvm.10'
    runs-on: [self-hosted, Linux, X64, purge-ci]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Rebuild and upload immutable .10 release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag=v1.1.92-wxcvm.10
          expected_commit=66ddb75e6303c723f1e970c1c31f26a66497bbbf
          version=1.1.92-wxcvm.10
          actual_commit="$(git rev-parse "refs/tags/${tag}^{commit}")"
          test "$actual_commit" = "$expected_commit"
          api_headers=(-H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28")
          curl_args=(--fail --silent --show-error --location --retry 4 --retry-all-errors --retry-delay 3 --connect-timeout 15 --max-time 90)
          get_release() {
            curl "${curl_args[@]}" "${api_headers[@]}" "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$tag"
          }
          release_json="$(get_release)"
          release_id="$(printf '%s' "$release_json" | EXPECTED="$expected_commit" node -e 'const r=JSON.parse(require("fs").readFileSync(0,"utf8")); if(r.target_commitish!==process.env.EXPECTED)process.exit(1); process.stdout.write(String(r.id));')"
          first="$(git show "$actual_commit:release-notes-wxcvm.md" | sed -n '1p' | tr -d '\r')"
          test "$first" = "# $version"
          zip="dsh-purge-$version.zip"
          git archive --format=zip --prefix="dsh-purge-$version/" --output="$zip" "$actual_commit"
          test -s "$zip"
          archived_version="$(unzip -p "$zip" "dsh-purge-$version/package.json" | node -e "process.stdout.write(JSON.parse(require('fs').readFileSync(0,'utf8')).version)")"
          test "$archived_version" = "$version"
          for file in client.js lib/redteam/client.js lib/redteam/store-core.js lib/redteam/tools.js lib/redteam/task-context.js lib/artex-knowledge.js lib/redteam/adapters/wsl.js lib/redteam/adapters/ssh-kali.js scripts/update-desktop-fork.ps1; do
            unzip -Z1 "$zip" | grep -Fx "dsh-purge-$version/$file" >/dev/null
          done
          sha256sum "$zip" > SHA256SUMS.txt
          # Use GitHub's documented REST asset endpoint directly: no gh GraphQL preflight.
          # Re-check the Release after a retry because an interrupted POST may have completed.
          asset_uploaded() {
            printf '%s' "$release_json" | FILE_NAME="$1" node -e '
              const r=JSON.parse(require("fs").readFileSync(0,"utf8"));
              if(!r.assets.some(a=>a.name===process.env.FILE_NAME && a.state==="uploaded" && a.size>0))process.exit(1);
            '
          }
          for file in "$zip" SHA256SUMS.txt; do
            release_json="$(get_release)"
            if asset_uploaded "$file"; then
              echo "Already uploaded: $file"
              continue
            fi
            if ! curl "${curl_args[@]}" --max-time 180 "${api_headers[@]}" -H "Content-Type: application/octet-stream" \
                --data-binary "@$file" -o upload-response.json \
                "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$release_id/assets?name=$file"; then
              echo "Upload returned an error, checking whether GitHub received $file"
            fi
            release_json="$(get_release)"
            asset_uploaded "$file"
          done
          release_json="$(get_release)"
          asset_uploaded "$zip"
          asset_uploaded SHA256SUMS.txt
          echo "Verified .10 assets on the existing GitHub Release"
