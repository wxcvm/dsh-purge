name: FlClash outbound IP regression (local)

on:
  push:
    branches: [ci/flclash-outbound-ip-92]

permissions:
  contents: read

concurrency:
  group: flclash-outbound-ip-92
  cancel-in-progress: true

jobs:
  windows:
    runs-on: [self-hosted, Windows, X64, purge-ci]
    timeout-minutes: 30
    steps:
      - name: Reuse persistent checkout of the reviewed FlClash revision
        shell: pwsh
        run: |
          $source = Join-Path $env:RUNNER_TOOL_CACHE 'flclash-regression-source'
          $revision = '01e592ca77e5f8bf20d4f6afa367777bdfc9a207'
          if (-not (Test-Path (Join-Path $source '.git'))) {
            New-Item -ItemType Directory -Force -Path $source | Out-Null
            git -C $source init
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git -C $source remote add origin https://github.com/wxcvm/FlClash.git
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          git -C $source rev-parse --verify --quiet "$revision^{commit}"
          if ($LASTEXITCODE -ne 0) {
            git -C $source fetch --no-tags --depth=1 origin $revision
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          git -C $source checkout --detach --force $revision
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C $source -c 'url.https://github.com/.insteadOf=git@github.com:' submodule update --init --recursive --depth=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "FLCLASH_SOURCE=$source"
      - name: Set up pinned Flutter SDK using native Windows PowerShell
        shell: pwsh
        run: |
          $version = '3.47.6'
          $root = Join-Path $env:RUNNER_TOOL_CACHE "flclash-flutter-$version"
          $sdk = Join-Path $root 'flutter'
          $flutter = Join-Path $sdk 'bin\flutter.bat'
          if (-not (Test-Path -LiteralPath $flutter)) {
            $stage = Join-Path $env:RUNNER_TEMP "flclash-flutter-$version-$env:GITHUB_RUN_ID"
            try {
              git clone -c core.longpaths=true --depth 1 --branch $version https://github.com/flutter/flutter.git $stage
              if ($LASTEXITCODE -ne 0) { throw 'Flutter SDK clone failed' }
              $revision = git -C $stage rev-parse HEAD
              if ($LASTEXITCODE -ne 0 -or $revision -ne '5fc346839b5d0eef006ed8404392afb4dfae428d') {
                throw 'Flutter SDK revision does not match the pinned release'
              }
              New-Item -ItemType Directory -Force -Path $root | Out-Null
              Move-Item -LiteralPath $stage -Destination $sdk
            } finally {
              Remove-Item -LiteralPath $stage -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
          $revision = git -C $sdk rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $revision -ne '5fc346839b5d0eef006ed8404392afb4dfae428d') {
            throw 'Cached Flutter SDK revision does not match the pinned release'
          }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value (Join-Path $sdk 'bin')
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "FLUTTER_ROOT=$sdk"
          # Flutter's default BITS/WebRequest restarts the SDK transfer after
          # a dropped connection. Keep partial bytes in the runner tool cache.
          $engine = (Get-Content -LiteralPath (Join-Path $sdk 'bin\internal\engine.version')).Trim()
          $cache = Join-Path $sdk 'bin\cache'
          $stamp = Join-Path $cache 'engine-dart-sdk.stamp'
          $dart = Join-Path $cache 'dart-sdk\bin\dart.exe'
          if (-not (Test-Path $dart) -or -not (Test-Path $stamp) -or (Get-Content $stamp).Trim() -ne $engine) {
            $archive = Join-Path $root "dart-sdk-$engine-windows-x64.zip"
            $base = if ($env:FLUTTER_STORAGE_BASE_URL) { $env:FLUTTER_STORAGE_BASE_URL.TrimEnd('/') } else { 'https://storage.googleapis.com' }
            $url = "$base/flutter_infra_release/flutter/$engine/dart-sdk-windows-x64.zip"
            $downloaded = $false
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              curl.exe --fail --location --connect-timeout 20 --max-time 240 --continue-at - --output $archive $url
              if ($LASTEXITCODE -eq 0) { $downloaded = $true; break }
              # HTTP 416 can mean the prior run already downloaded all bytes.
              if ((Test-Path $archive) -and $LASTEXITCODE -eq 22) {
                tar.exe -tf $archive *> $null
                if ($LASTEXITCODE -eq 0) { $downloaded = $true; break }
              }
              if ($attempt -lt 3) { Start-Sleep -Seconds 5 }
            }
            if (-not $downloaded) { throw 'Dart SDK transfer incomplete; partial archive retained for next run' }
            $stage = Join-Path $root 'dart-sdk-extract'
            New-Item -ItemType Directory -Force -Path $stage | Out-Null
            try {
              tar.exe -xf $archive -C $stage
              if ($LASTEXITCODE -ne 0 -or -not (Test-Path (Join-Path $stage 'dart-sdk\bin\dart.exe'))) {
                Remove-Item -LiteralPath $archive -Force
                throw 'Dart SDK archive is invalid'
              }
              New-Item -ItemType Directory -Force -Path $cache | Out-Null
              $target = Join-Path $cache 'dart-sdk'
              if (Test-Path $target) { Remove-Item -LiteralPath $target -Recurse -Force }
              Move-Item -LiteralPath (Join-Path $stage 'dart-sdk') -Destination $target
              Set-Content -LiteralPath $stamp -Value $engine -Encoding ascii
              Remove-Item -LiteralPath $archive -Force
            } finally {
              Remove-Item -LiteralPath $stage -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
          & $flutter --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install Flutter dependencies
        working-directory: ${{ env.FLCLASH_SOURCE }}
        run: flutter pub get
      - name: Check formatting
        working-directory: ${{ env.FLCLASH_SOURCE }}
        run: dart format --output=none --set-exit-if-changed lib/providers/outbound_ip.dart test/providers/outbound_ip_test.dart
      - name: Disable Go core build hook for Dart tests
        working-directory: ${{ env.FLCLASH_SOURCE }}
        shell: pwsh
        run: |
          $path = 'pubspec.yaml'
          $text = Get-Content -Raw -LiteralPath $path
          $text = $text -replace '(?m)(    setup:\r?\n      build_assets:) true', '$1 false'
          if ($text -notmatch '(?m)    setup:\r?\n      build_assets: false') { throw 'Go build hook setting not found' }
          Set-Content -LiteralPath $path -Value $text -NoNewline
      - name: Run outbound IP and route regression tests
        working-directory: ${{ env.FLCLASH_SOURCE }}
        run: flutter test test/providers/outbound_ip_test.dart test/providers/routed_probe_test.dart test/views/dashboard/current_outbound_test.dart --reporter expanded
