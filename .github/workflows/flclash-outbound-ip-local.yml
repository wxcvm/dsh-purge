name: FlClash outbound IP regression (local)

on:
  push:
    branches: [ci/flclash-outbound-ip-92]

permissions:
  contents: read

concurrency:
  group: flclash-outbound-ip-92
  cancel-in-progress: true

jobs:
  windows:
    runs-on: [self-hosted, Windows, X64, purge-ci]
    timeout-minutes: 30
    steps:
      - name: Checkout exact reviewed FlClash revision
        uses: actions/checkout@v4
        with:
          repository: wxcvm/FlClash
          ref: 01e592ca77e5f8bf20d4f6afa367777bdfc9a207
          submodules: recursive
          persist-credentials: false
          path: flclash
      - name: Set up pinned Flutter SDK using native Windows PowerShell
        shell: pwsh
        run: |
          $version = '3.47.6'
          $root = Join-Path $env:RUNNER_TOOL_CACHE "flclash-flutter-$version"
          $sdk = Join-Path $root 'flutter'
          $flutter = Join-Path $sdk 'bin\flutter.bat'
          if (-not (Test-Path -LiteralPath $flutter)) {
            $manifest = Invoke-RestMethod 'https://storage.googleapis.com/flutter_infra_release/flutter/releases/releases_windows.json'
            $release = $manifest.releases | Where-Object {
              $_.version -eq $version -and $_.channel -eq 'stable' -and
              (-not $_.dart_sdk_arch -or $_.dart_sdk_arch -eq 'x64')
            } | Select-Object -First 1
            if (-not $release) { throw "Flutter stable $version x64 not found" }
            $zip = Join-Path $env:RUNNER_TEMP "flutter-$version-windows.zip"
            $stage = Join-Path $env:RUNNER_TEMP "flclash-flutter-$version-$env:GITHUB_RUN_ID"
            try {
              Invoke-WebRequest -Uri "$($manifest.base_url)/$($release.archive)" -OutFile $zip
              New-Item -ItemType Directory -Force -Path $stage | Out-Null
              tar.exe -xf $zip -C $stage
              if ($LASTEXITCODE -ne 0) { throw 'Flutter SDK extraction failed' }
              if (-not (Test-Path (Join-Path $stage 'flutter\bin\flutter.bat'))) { throw 'Flutter SDK missing after extraction' }
              New-Item -ItemType Directory -Force -Path $root | Out-Null
              Move-Item -LiteralPath (Join-Path $stage 'flutter') -Destination $sdk
            } finally {
              Remove-Item -LiteralPath $zip -Force -ErrorAction SilentlyContinue
              Remove-Item -LiteralPath $stage -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value (Join-Path $sdk 'bin')
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "FLUTTER_ROOT=$sdk"
          & $flutter --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install Flutter dependencies
        working-directory: flclash
        run: flutter pub get
      - name: Check formatting
        working-directory: flclash
        run: dart format --output=none --set-exit-if-changed lib/providers/outbound_ip.dart test/providers/outbound_ip_test.dart
      - name: Disable Go core build hook for Dart tests
        working-directory: flclash
        shell: pwsh
        run: |
          $path = 'pubspec.yaml'
          $text = Get-Content -Raw -LiteralPath $path
          $text = $text -replace '(?m)(    setup:\r?\n      build_assets:) true', '$1 false'
          if ($text -notmatch '(?m)    setup:\r?\n      build_assets: false') { throw 'Go build hook setting not found' }
          Set-Content -LiteralPath $path -Value $text -NoNewline
      - name: Run outbound IP and route regression tests
        working-directory: flclash
        run: flutter test test/providers/outbound_ip_test.dart test/providers/routed_probe_test.dart test/views/dashboard/current_outbound_test.dart --reporter expanded
