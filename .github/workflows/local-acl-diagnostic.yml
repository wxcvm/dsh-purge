name: Local ACL diagnostic
on:
  push:
    branches: [ci/local-acl-diagnostic-20261115]
    paths: ['.github/workflows/local-acl-diagnostic.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: [self-hosted, Windows, X64, purge-ci]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Reproduce the real Node fixture and expose only aggregate counts
        shell: pwsh
        run: |
          $file = 'test/storage-audit.test.mjs'
          $text = Get-Content -LiteralPath $file -Raw
          $text = $text.Replace("  assert.equal(result.status, 'complete')", "  assert.equal(result.status, 'complete', JSON.stringify(result))")
          Set-Content -LiteralPath $file -Value $text -Encoding utf8
          node --test test/storage-audit.test.mjs
      - name: Prepare the same official fixture
        if: always()
        shell: pwsh
        run: |
          node scripts/prepare-host-fixture.mjs 0.2.2-rc.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm install --prefix ".scratch/hosts/0.2.2-rc.2" --ignore-scripts --legacy-peer-deps --no-audit --no-fund --omit=optional
      - name: Repeat the same full suite with diagnostic counts
        if: always()
        shell: pwsh
        run: |
          $env:DSH_COMPAT_HOST_ROOT = Join-Path $env:GITHUB_WORKSPACE '.scratch/hosts/0.2.2-rc.2'
          node --test "test/*.test.*" "maintenance/*.test.mjs" "maintenance/desktop-tools/*.test.mjs"
