name: Local ACL diagnostic
on:
  push:
    branches: [ci/local-acl-diagnostic-20261115]
    paths: ['.github/workflows/local-acl-diagnostic.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: [self-hosted, Windows, X64, purge-ci]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Capture the specific ACL exception from the real Node invocation
        shell: pwsh
        run: |
          $file = 'scripts/protect-redteam-acl.ps1'
          $source = Get-Content -LiteralPath $file -Raw
          $original = '            $summary.aclReadErrors++'
          $replacement = @'
                      $summary.aclReadErrors++
                      Write-Output ('ACL_DIAGNOSTIC ' + $_.Exception.GetType().FullName + ' | ' + $_.FullyQualifiedErrorId + ' | ' + $_.Exception.Message.Replace($Root, '<fixture>'))
          '@
          if (-not $source.Contains($original)) { throw 'Expected ACL catch not found' }
          Set-Content -LiteralPath $file -Value $source.Replace($original, $replacement) -Encoding utf8
          $diagnostic = @'
          import { execFile } from 'node:child_process'
          import { promisify } from 'node:util'
          import { mkdtempSync, writeFileSync } from 'node:fs'
          import { tmpdir } from 'node:os'
          import { join } from 'node:path'
          import { inspectStorageAcl } from './lib/redteam/storage-audit.js'
          const dir = mkdtempSync(join(tmpdir(), 'purge-storage-audit-'))
          writeFileSync(join(dir, 'fixture.txt'), 'unchanged')
          writeFileSync('.acl-fixture-path', dir)
          const run = promisify(execFile)
          const result = await inspectStorageAcl(dir, {
            run: async (exe, args, options) => {
              const output = await run(exe, args, options)
              console.log(output.stdout.replaceAll(dir, '<fixture>'))
              return output
            },
          })
          console.log('NODE_RESULT', JSON.stringify(result))
          '@
          Set-Content -LiteralPath '.acl-diagnostic.mjs' -Value $diagnostic -Encoding utf8
          try {
            node .acl-diagnostic.mjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $dir = Get-Content -LiteralPath '.acl-fixture-path' -Raw
            Write-Host 'Direct shell on exactly the same Node-created fixture:'
            & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $file -Root $dir
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            if (Test-Path -LiteralPath '.acl-fixture-path') {
              $dir = Get-Content -LiteralPath '.acl-fixture-path' -Raw
              Remove-Item -LiteralPath $dir -Recurse -Force
            }
          }
