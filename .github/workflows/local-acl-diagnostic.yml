name: Local ACL diagnostic
on:
  push:
    branches: [ci/local-acl-diagnostic-20261115]
    paths: ['.github/workflows/local-acl-diagnostic.yml']
permissions:
  contents: read
jobs:
  verify-fixed-master:
    runs-on: [self-hosted, Windows, X64, purge-ci]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 69c401a56dbe8f0c41b98152ae9958a78f053a7f
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify original failing ACL integration test
        shell: pwsh
        run: node --test test/storage-audit.test.mjs
      - name: Prepare same official fixture
        shell: pwsh
        run: |
          node scripts/prepare-host-fixture.mjs 0.2.2-rc.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm install --prefix ".scratch/hosts/0.2.2-rc.2" --ignore-scripts --legacy-peer-deps --no-audit --no-fund --omit=optional
      - name: Verify generated bundle and Windows regressions
        shell: pwsh
        run: |
          node scripts/build-client.mjs --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/check-syntax.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./maintenance/inject-switch/Build.ps1
          ./scripts/test-desktop-updater.ps1
          ./scripts/test-desktop-updater-junction.ps1
          ./scripts/test-private-acl.ps1
      - name: Verify complete original test suite
        shell: pwsh
        run: |
          $env:DSH_COMPAT_HOST_ROOT = Join-Path $env:GITHUB_WORKSPACE '.scratch/hosts/0.2.2-rc.2'
          node --test "test/*.test.*" "maintenance/*.test.mjs" "maintenance/desktop-tools/*.test.mjs"
