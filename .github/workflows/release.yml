name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Verify the release archive without publishing
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'wxcvm/dsh-purge' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    runs-on: [self-hosted, Linux, X64, purge-ci]
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install declared dependencies without lifecycle scripts
        run: npm install --ignore-scripts --legacy-peer-deps --no-audit --no-fund --omit=optional --package-lock=false --prefer-offline

      - name: Syntax-check plugin entry
        run: |
          node --check lib/index.js
          node --check lib/core.js
          node --check lib/reapply.js
          node --input-type=module -e "import './lib/index.js'"

      - name: Build, verify and optionally publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          notes="release-notes.md"
          if [ "$GITHUB_REPOSITORY" = "wxcvm/dsh-purge" ]; then
            notes="release-notes-wxcvm.md"
          fi
          first="$(head -n 1 "$notes" | tr -d '\r')"
          if [ "$first" != "# ${version}" ]; then
            echo "$notes 第一行必须是 # ${version}，现在是: ${first}"
            exit 1
          fi
          zip="dsh-purge-$version.zip"
          # Retry with the tag's exact source revision rather than moving master.
          commit="$GITHUB_SHA"
          if git rev-parse -q --verify "refs/tags/$tag^{}" >/dev/null; then
            commit="$(git rev-parse "refs/tags/$tag^{}")"
          fi
          git archive --format=zip --prefix="dsh-purge-$version/" --output="$zip" "$commit"
          test -s "$zip"
          archived_version="$(unzip -p "$zip" "dsh-purge-$version/package.json" |
            node -e "process.stdout.write(JSON.parse(require('fs').readFileSync(0,'utf8')).version)")"
          test "$archived_version" = "$version"
          if [ "$GITHUB_REPOSITORY" = "wxcvm/dsh-purge" ]; then
            for file in client.js lib/redteam/client.js lib/redteam/store-core.js lib/redteam/tools.js lib/redteam/task-context.js lib/artex-knowledge.js lib/redteam/adapters/wsl.js lib/redteam/adapters/ssh-kali.js scripts/update-desktop-fork.ps1; do
              unzip -Z1 "$zip" | grep -Fx "dsh-purge-$version/$file" >/dev/null
            done
          fi
          sha256sum "$zip" > SHA256SUMS.txt
          if [ "$DRY_RUN" = "true" ]; then
            echo "Release archive verified: $zip (no publication)"
            exit 0
          fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            case "$version" in
              *beta*|*alpha*|*rc*)
                gh release create "$tag" --target "$commit" --title "$tag" --notes-file "$notes" --prerelease ;;
              *)
                gh release create "$tag" --target "$commit" --title "$tag" --notes-file "$notes" ;;
            esac
          fi
          gh release upload "$tag" "$zip" SHA256SUMS.txt --clobber
          echo "published https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag"
