name: Release

on:
  push:
    branches: ["release/v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Verify the release archive without publishing
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'wxcvm/dsh-purge' && ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/v')))
    runs-on: [self-hosted, Linux, X64, purge-ci]
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install declared dependencies without lifecycle scripts
        run: npm install --ignore-scripts --legacy-peer-deps --no-audit --no-fund --omit=optional --package-lock=false --prefer-offline

      - name: Syntax-check plugin entry
        run: |
          node --check lib/index.js
          node --check lib/core.js
          node --check lib/reapply.js
          node --input-type=module -e "import './lib/index.js'"

      - name: Build, verify and optionally publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          notes="release-notes.md"
          if [ "$GITHUB_REPOSITORY" = "wxcvm/dsh-purge" ]; then
            notes="release-notes-wxcvm.md"
          fi
          first="$(head -n 1 "$notes" | tr -d '\r')"
          if [ "$first" != "# ${version}" ]; then
            echo "$notes 第一行必须是 # ${version}，现在是: ${first}"
            exit 1
          fi
          # Keep the release description scoped to this candidate; the notes
          # file is a changelog and also includes all older version sections.
          current_notes="$(mktemp)"
          trap 'rm -f "$current_notes"' EXIT
          awk 'NR > 1 && /^# / { exit } { print }' "$notes" > "$current_notes"
          zip="dsh-purge-$version.zip"
          # Never package an older tagged source under a new master candidate.
          commit="$GITHUB_SHA"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            expected_branch="release/$tag"
            if [ "$GITHUB_REF_NAME" != "$expected_branch" ]; then
              echo "::error::Release branch must match package version: $expected_branch"
              exit 1
            fi
            master_commit="$(git rev-parse refs/remotes/origin/master)"
            if [ "$master_commit" != "$commit" ]; then
              echo "::error::Release branch must point to current master ($master_commit), not $commit"
              exit 1
            fi
          fi
          if git rev-parse -q --verify "refs/tags/$tag^{}" >/dev/null; then
            tagged_commit="$(git rev-parse "refs/tags/$tag^{}")"
            if [ "$tagged_commit" != "$commit" ]; then
              echo "::error::Version $version already has tag $tag at $tagged_commit, not master $commit; use a new version instead of republishing old source."
              exit 1
            fi
          fi
          git archive --format=zip --prefix="dsh-purge-$version/" --output="$zip" "$commit"
          test -s "$zip"
          archived_version="$(unzip -p "$zip" "dsh-purge-$version/package.json" |
            node -e "process.stdout.write(JSON.parse(require('fs').readFileSync(0,'utf8')).version)")"
          test "$archived_version" = "$version"
          if [ "$GITHUB_REPOSITORY" = "wxcvm/dsh-purge" ]; then
            for file in client.js lib/redteam/client.js lib/redteam/store-core.js lib/redteam/tools.js lib/redteam/task-context.js lib/artex-knowledge.js lib/redteam/adapters/wsl.js lib/redteam/adapters/ssh-kali.js scripts/update-desktop-fork.ps1; do
              unzip -Z1 "$zip" | grep -Fx "dsh-purge-$version/$file" >/dev/null
            done
          fi
          sha256sum "$zip" > SHA256SUMS.txt
          if [ "$DRY_RUN" = "true" ]; then
            echo "Release archive verified: $zip (no publication)"
            cat SHA256SUMS.txt
            exit 0
          fi
          # A published release is immutable: never replace its archives, even on a rerun.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists; refusing to overwrite immutable assets. Use a new version."
            exit 1
          fi
          case "$version" in
            *beta*|*alpha*|*rc*)
              gh release create "$tag" --target "$commit" --title "$tag" --notes-file "$current_notes" --prerelease ;;
            *)
              gh release create "$tag" --target "$commit" --title "$tag" --notes-file "$current_notes" ;;
          esac
          # GitHub must reject any existing asset name instead of silently replacing it.
          gh release upload "$tag" "$zip" SHA256SUMS.txt
          echo "published https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag"
