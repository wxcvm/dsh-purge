name: Windows Local Compatibility

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-compatibility:
    runs-on: [self-hosted, Windows, X64, purge-ci]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare latest official fixture, without host or model execution
        shell: pwsh
        run: |
          $fixture = node scripts/prepare-host-fixture.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "DSH_COMPAT_HOST_ROOT=$fixture" -Encoding utf8
      - name: Install isolated fixture with all lifecycle scripts disabled
        shell: pwsh
        run: npm install --prefix "$env:DSH_COMPAT_HOST_ROOT" --ignore-scripts --legacy-peer-deps --no-audit --no-fund --omit=optional
      - name: Check generated bundle and syntax
        shell: pwsh
        run: |
          node scripts/build-client.mjs --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/check-syntax.mjs
      - name: Compile optional Windows injection switch
        shell: pwsh
        run: ./maintenance/inject-switch/Build.ps1
      - name: Smoke-test Desktop updater and simulated rollback
        shell: pwsh
        run: ./scripts/test-desktop-updater.ps1
      - name: Exercise Windows pnpm junction rollback
        shell: pwsh
        run: ./scripts/test-desktop-updater-junction.ps1
      - name: Smoke-test optional Windows NTFS ACL protector
        shell: pwsh
        run: ./scripts/test-private-acl.ps1
      - name: Run unit and public API contract tests
        shell: pwsh
        run: node --test "test/*.test.*" "maintenance/*.test.mjs" "maintenance/desktop-tools/*.test.mjs"
