name: Windows Local Compatibility

on:
  workflow_dispatch:
    inputs:
      host:
        description: Official host fixture version
        required: true
        type: choice
        default: 0.2.2-rc.1
        options:
          - 0.2.1-rc.2
          - 0.2.1-rc.3
          - 0.2.1-rc.4
          - 0.2.1-rc.5
          - 0.2.2-rc.1
          - 0.2.2-rc.2

permissions:
  contents: read

jobs:
  windows-compatibility:
    runs-on: [self-hosted, Windows, X64, purge-ci]
    timeout-minutes: 30
    env:
      HOST_VERSION: ${{ inputs.host }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare explicit official fixture
        shell: pwsh
        run: node scripts/prepare-host-fixture.mjs $env:HOST_VERSION
      - name: Install isolated fixture without lifecycle scripts
        shell: pwsh
        run: npm install --prefix ".scratch/hosts/$env:HOST_VERSION" --ignore-scripts --legacy-peer-deps --no-audit --no-fund --omit=optional
      - name: Check generated bundle and syntax
        shell: pwsh
        run: |
          node scripts/build-client.mjs --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/check-syntax.mjs
      - name: Compile optional Windows injection switch
        shell: pwsh
        run: ./maintenance/inject-switch/Build.ps1
      - name: Smoke-test Desktop updater and simulated rollback
        shell: pwsh
        run: ./scripts/test-desktop-updater.ps1
      - name: Exercise Windows pnpm junction rollback
        shell: pwsh
        run: ./scripts/test-desktop-updater-junction.ps1
      - name: Smoke-test optional Windows NTFS ACL protector
        shell: pwsh
        run: ./scripts/test-private-acl.ps1
      - name: Run unit and public API contract tests
        shell: pwsh
        run: |
          $env:DSH_COMPAT_HOST_ROOT = Join-Path $env:GITHUB_WORKSPACE ".scratch/hosts/$env:HOST_VERSION"
          node --test "test/*.test.*" "maintenance/*.test.mjs" "maintenance/desktop-tools/*.test.mjs"
