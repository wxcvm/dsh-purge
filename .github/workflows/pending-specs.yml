name: Pending specifications (non-blocking)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pending:
    name: Pending specs (failures explicitly reported)
    runs-on: [self-hosted, Windows, X64, purge-ci]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install runtime dependencies without lifecycle scripts
        run: npm install --ignore-scripts --legacy-peer-deps --no-audit --no-fund --prefer-offline --omit=optional
      - name: Run pending specifications
        id: specs
        continue-on-error: true
        shell: pwsh
        run: node --test "test-pending/*.mjs"
      - name: Report pending status prominently
        if: always()
        shell: pwsh
        env:
          PENDING_OUTCOME: ${{ steps.specs.outcome }}
        run: |
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value '## Pending specifications (not release-gating)' -Encoding utf8
          if ($env:PENDING_OUTCOME -eq 'failure') {
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value 'Pending specifications currently fail. Inspect the preceding test step before claiming full coverage.' -Encoding utf8
            Write-Host '::warning title=Pending specs failing::Known pending tests are visible and not part of the green release gate.'
          } else {
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "Result: $env:PENDING_OUTCOME" -Encoding utf8
          }
