name: Finalize .6 release notes (one time)
on:
  push:
    branches: [release/publish-wxcvm-6-8470eec]
permissions:
  contents: write
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false
jobs:
  notes:
    if: github.repository == 'wxcvm/dsh-purge'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct release notes without changing tag or assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag=v1.1.92-wxcvm.6
          test "$(git ls-remote origin "refs/tags/$tag" | cut -f1)" = "8470eecd886c3765f88da094e9142844175c47d5"
          test "$(gh release view "$tag" --json isDraft,isPrerelease --jq '.isDraft == false and .isPrerelease == true')" = true
          gh release edit "$tag" --notes-file .github/wxcvm-6-published-notes.md
          gh release view "$tag" --json tagName,isDraft,isPrerelease,url
