name: Repair center regression
on:
  pull_request:
  push:
    branches: [beta]
jobs:
  repair-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    # Opt-in only after the repository's dedicated Windows runner is registered.
    # Fork PRs retain hosted execution; never route their code onto the personal machine.
    runs-on: ${{ fromJSON(matrix.os == 'windows-latest' && vars.PURGE_WINDOWS_RUNNER == 'self-hosted' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted","Windows","X64","purge-ci"]' || format('["{0}"]', matrix.os)) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --ignore-scripts --package-lock=false --legacy-peer-deps
      - run: node --test test/repair-center.test.mjs test/repair-center-ui.test.mjs test/desktop-runtime-health.test.mjs test/desktop-runtime-ui.test.mjs test/official-update-handoff.test.mjs
      - run: node scripts/build-client.mjs --check
