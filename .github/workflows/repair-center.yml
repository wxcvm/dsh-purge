name: Repair center regression
on:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repair-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    # Use registered local runners for trusted repository branches; forks remain hosted.
    runs-on: ${{ fromJSON((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (matrix.os == 'windows-latest' && '["self-hosted","Windows","X64","purge-ci"]' || '["self-hosted","Linux","X64","purge-ci"]') || format('["{0}"]', matrix.os)) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --ignore-scripts --package-lock=false --legacy-peer-deps --no-audit --no-fund --prefer-offline
      - run: node --test test/repair-center.test.mjs test/repair-center-ui.test.mjs test/desktop-runtime-health.test.mjs test/desktop-runtime-ui.test.mjs test/official-update-handoff.test.mjs
      - run: node scripts/build-client.mjs --check
