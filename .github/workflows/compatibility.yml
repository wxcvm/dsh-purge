name: Linux Local Compatibility

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-contracts:
    runs-on: [self-hosted, Linux, X64, purge-ci]
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare latest official fixture, without host or model execution
        run: |
          fixture="$(node scripts/prepare-host-fixture.mjs)"
          printf 'DSH_COMPAT_HOST_ROOT=%s\n' "$fixture" >> "$GITHUB_ENV"
      - name: Install isolated fixture with all lifecycle scripts disabled
        run: npm install --prefix "$DSH_COMPAT_HOST_ROOT" --ignore-scripts --legacy-peer-deps --no-audit --no-fund --omit=optional
      - name: Check generated bundle and syntax
        run: |
          node scripts/build-client.mjs --check
          node scripts/check-syntax.mjs
      - name: Run unit and actual public API contract tests
        run: node --test "test/*.test.*" "maintenance/*.test.mjs" "maintenance/desktop-tools/*.test.mjs"
