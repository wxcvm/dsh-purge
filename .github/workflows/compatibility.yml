name: Maintenance compatibility

on:
  workflow_dispatch:
  push:
    branches: [master, codex/compat-maintenance, codex/redteam-workflow-enhancement]
  pull_request:

permissions:
  contents: read

# A newer revision of the same PR/branch supersedes stale queued work.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  api-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        group: [current]
        include:
          - group: current
            hosts: '0.2.2-rc.3'
    # Use registered local runners for trusted repository branches; forks remain hosted.
    runs-on: ${{ fromJSON((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (matrix.os == 'windows-latest' && '["self-hosted","Windows","X64","purge-ci"]' || '["self-hosted","Linux","X64","purge-ci"]') || format('["{0}"]', matrix.os)) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Locate npm download cache
        if: runner.environment == 'github-hosted'
        id: npm-cache
        shell: bash
        run: printf 'path=%s\n' "$(npm config get cache | tr -d '\r')" >> "$GITHUB_OUTPUT"
      - name: Cache npm downloads (not installed fixtures)
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v4
        with:
          path: ${{ steps.npm-cache.outputs.path }}
          key: npm-compat-${{ runner.os }}-node24-${{ matrix.group }}-${{ hashFiles('scripts/prepare-host-fixture.mjs', 'package.json') }}
          restore-keys: |
            npm-compat-${{ runner.os }}-node24-${{ matrix.group }}-
      - name: Install declared plugin dependencies for full regression suite
        if: matrix.group == 'current'
        run: npm install --ignore-scripts --legacy-peer-deps --no-audit --no-fund --prefer-offline --omit=optional --package-lock=false
      - name: Check generated bundle and syntax once per OS
        if: matrix.group == 'current'
        run: |
          node scripts/build-client.mjs --check
          node scripts/check-syntax.mjs
      # These Windows-only checks are unchanged, and run once in the current group.
      - name: Compile optional Windows injection switch from source
        if: runner.os == 'Windows' && matrix.group == 'current'
        shell: pwsh
        run: ./maintenance/inject-switch/Build.ps1
      - name: Attach optional Windows switch executable
        if: runner.os == 'Windows' && matrix.group == 'current'
        uses: actions/upload-artifact@v4
        with:
          name: dsh-inject-switch-windows
          path: maintenance/inject-switch/dist/dsh-inject-switch.exe
          retention-days: 14
      - name: Smoke-test Desktop updater and simulated rollback
        if: runner.os == 'Windows' && matrix.group == 'current'
        shell: pwsh
        run: ./scripts/test-desktop-updater.ps1
      - name: Exercise Windows pnpm junction rollback
        if: runner.os == 'Windows' && matrix.group == 'current'
        shell: pwsh
        run: ./scripts/test-desktop-updater-junction.ps1
      - name: Smoke-test optional Windows NTFS ACL protector
        if: runner.os == 'Windows' && matrix.group == 'current'
        shell: pwsh
        run: ./scripts/test-private-acl.ps1
      - name: Prepare latest official host fixture
        id: fixture
        run: node scripts/prepare-host-fixture.mjs ${{ matrix.hosts }}
      - name: Install isolated fixture dependencies
        id: fixture-install
        run: npm install --prefix ".scratch/hosts/${{ matrix.hosts }}" --ignore-scripts --legacy-peer-deps --no-audit --no-fund --prefer-offline --omit=optional
      - name: Run official host regression tests
        id: fixture-tests
        run: node scripts/run-compat-tests.mjs ${{ matrix.hosts }}
      - name: Report host result
        if: always()
        env:
          HOST_VERSION: ${{ matrix.hosts }}
          HOST_RESULT: ${{ steps.fixture-tests.outcome }}
        run: node -e "require('node:fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, '| ' + process.env.HOST_VERSION + ' | ' + (process.env.HOST_RESULT === 'success' ? 'passed' : 'failed or not run') + ' |' + String.fromCharCode(10))"
