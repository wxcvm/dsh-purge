name: QA Headless Startup Isolation
on:
  pull_request:
    types: [synchronize]
permissions:
  contents: read
jobs:
  preflight:
    if: github.head_ref == 'robin/qa-headless-paired-retry-20261116'
    runs-on: [self-hosted, Windows]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Compare no-model startup across profile layers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Join-Path $env:RUNNER_TEMP 'purge-qa-compose.mjs'
          @'
          import fs from 'node:fs'
          import os from 'node:os'
          import path from 'node:path'
          import { pathToFileURL } from 'node:url'
          import { createRequire } from 'node:module'
          import { spawnSync } from 'node:child_process'
          const root = 'D:\\dsh'
          const exe = path.join(root, 'DeepSeek Harness.exe')
          const cli = path.join(root, 'resources/app/dsh/node_modules/@deepseek-ai/dsh-desktop-host/lib/cli.js')
          const home = process.env.DSH_HOME || path.join(os.homedir(), '.dsh')
          const support = path.join(root, 'resources/runtime')
          const profileRoot = path.join(home, 'profiles')
          const req = createRequire(cli)
          const parse = req('yaml').parse
          const desktopReq = createRequire(path.join(profileRoot, 'desktop', 'package.json'))
          const reviewReq = createRequire(path.join(profileRoot, 'codex-review', 'package.json'))
          const tmp = fs.mkdtempSync(path.join(process.env.RUNNER_TEMP || os.tmpdir(), 'purge-qa-paired-'))
          const label = v => typeof v === 'string' && /^[\w./:@+-]{1,120}$/.test(v) ? v : null
          const collect = (v, out = []) => {
            if (!v || typeof v !== 'object') return out
            if (typeof v.id === 'string') out.push(v)
            for (const x of Object.values(v)) if (x && typeof x === 'object') collect(x, out)
            return out
          }
          const pick = (rows, id) => rows.find(row => row.id === id)
          const resolvePlugin = spec => {
            for (const resolver of [reviewReq, desktopReq, req]) {
              try { return resolver.resolve(spec) } catch {}
            }
            return null
          }
          const describe = row => row ? {id:row.id,name:label(row.name),disabled:row.disabled===true,keys:Object.keys(row.config||{})} : null
          const moduleDiagnostics = res => {
            const raw=(res.stderr||'')+'\n'+(res.status===0?'':res.stdout||'')
            const safeSpec=spec=>{
              if(/^(?:@[\w.-]+\/)?[\w.-]+(?:\/[\w.-]+)*$/.test(spec)&&spec.length<=200)return spec
              const normalized=spec.replace(/\\/g,'/')
              const m=normalized.match(/(?:^|\/)node_modules\/((?:@[\w.-]+\/)?[\w.-]+(?:\/[\w.-]+)*)$/)
              return m?.[1]?.slice(0,200)||path.win32.basename(spec).replace(/[^\w.@+-]/g,'').slice(0,100)||'unresolved-path'
            }
            const missing=[]
            for(const match of raw.matchAll(/Cannot find (?:package|module)\s+['"]([^'"\r\n]+)['"](?:\s+imported from\s+([^\r\n]+))?/g)){
              const row={specifier:safeSpec(match[1]),importer:match[2]?safeSpec(match[2].trim()):null}
              if(!missing.some(x=>JSON.stringify(x)===JSON.stringify(row)))missing.push(row)
            }
            return missing.slice(0,12)
          }
          const safeError = value => {
            if(typeof value!=='string'||!value.trim())return null
            let s=value.trim().replace(/\x1b\[[0-9;]*m/g,'')
            if(/(?:password|passwd|secret|api[_ -]?key|bearer|authorization\s*[:=]|access[_ -]?token|refresh[_ -]?token|cookie\s*[:=])/i.test(s))return '[sensitive diagnostic omitted]'
            s=s.replace(/https?:\/\/\S+/gi,'[url]').replace(/file:\/\/\/\S+/gi,'[file]')
              .replace(/[A-Za-z]:[\\/][^'"\r\n]+/g,'[local-path]')
              .replace(/(?:^|\s)\/(?:home|Users|tmp|var|mnt)\/\S+/g,' [local-path]')
              .replace(/[A-Za-z0-9_-]{32,}/g,'[opaque-id]')
              .replace(/[\r\n]+/g,' ')
            return s.slice(0,300)
          }
          const failureDetails = (run,events) => {
            const lines=(run.stderr||'').split(/\r?\n/).filter(x=>/\b(?:error|failed|fatal|invalid|unknown|missing|cannot|unsupported|preset|profile|plugin|credential)\b/i.test(x)&&! /^\s*at\s/.test(x))
            const errorEvents=events.filter(e=>['error','final','fatal'].includes(e?.type)).map(e=>({type:e.type,code:label(e.code||e.error?.code),message:safeError(typeof e.error==='string'?e.error:e.error?.message||e.message||e.reason?.message),reason:label(e.reason?.kind)}))
            return {stderr:lines.slice(0,5).map(safeError).filter(Boolean),eventTypes:[...new Set(events.map(e=>label(e?.type)).filter(Boolean))],errorEvents:errorEvents.slice(0,3)}
          }
          const classify = res => {
            const msg=(res.stderr||'')+'\n'+(res.status===0?'':res.stdout||'')
            return {exit:res.status,timeout:res.error?.code==='ETIMEDOUT',classes:['ERR_MODULE_NOT_FOUND','MODULE_NOT_FOUND','Cannot find','ENOENT','EACCES','EPERM','unknown','Unknown','invalid','Invalid','already queued','not found','profile','plugin','schema','TypeError','ReferenceError','SyntaxError'].filter(s=>msg.includes(s)),stderrBytes:Buffer.byteLength(res.stderr||''),missingModules:moduleDiagnostics(res)}
          }
          try {
            const entry=path.join(tmp,'entry.mjs')
            fs.writeFileSync(entry,'import {runDesktopCli} from '+JSON.stringify(pathToFileURL(cli).href)+';\nawait runDesktopCli('+JSON.stringify(support)+');\n')
            const call=(args,dshHome=home,timeout=30000,cwd=tmp)=>spawnSync(exe,['--expose-internals',entry,...args],{env:{...process.env,ELECTRON_RUN_AS_NODE:'1',DSH_HOME:dshHome},cwd,encoding:'utf8',timeout,windowsHide:true,maxBuffer:64*1024*1024})
            const baseRes=call(['--profile','codex-review','--dump-config'])
            if(baseRes.status!==0){console.log(JSON.stringify({stage:'base',...classify(baseRes)}));process.exitCode=2}
            else {
              const base=collect(parse(baseRes.stdout))
              const desktop=collect(parse(fs.readFileSync(path.join(profileRoot,'desktop','cordis.patch.yml'),'utf8')))
              const model=pick(desktop,'agent-default-model')
              const registry=pick(desktop,'agent-preset-registry')
              const sub=pick(desktop,'subagent')
              const purge=pick(desktop,'dsh-purge')
              const names=['agent-default-model','agent-preset-registry','subagent','dsh-purge','dsh-purge-redteam','dsh-purge-redteam-store','credentials','authorization','deepseek-account']
              console.log(JSON.stringify({stage:'inventory',base:names.map(id=>describe(pick(base,id))).filter(Boolean),desktop:names.map(id=>describe(pick(desktop,id))).filter(Boolean),model:{provider:label(model?.config?.provider),model:label(model?.config?.model),reasoningEffort:label(model?.config?.reasoningEffort)},preset:{default:label(registry?.config?.default),selectedDefault:label(registry?.config?.selectedDefault)},subagent:{maxDepth:sub?.config?.maxDepth??null,maxActiveSubagents:sub?.config?.maxActiveSubagents??null}}))
              const specs=['dsh-purge','dsh-purge/redteam','dsh-purge/redteam/store','dsh-purge/redteam/tools']
              const paths=Object.fromEntries(specs.map(spec=>[spec,resolvePlugin(spec)]))
              console.log(JSON.stringify({stage:'resolve',plugins:Object.fromEntries(specs.map(spec=>[spec,!!paths[spec]])),profileFiles:fs.readdirSync(path.join(profileRoot,'codex-review'),{withFileTypes:true}).filter(x=>x.isFile()).map(x=>x.name).filter(x=>/^(cordis|profile|package)\./.test(x))}))
              if(!model||!registry||!sub||!purge||!paths['dsh-purge']||!paths['dsh-purge/redteam']||!paths['dsh-purge/redteam/store']||!paths['dsh-purge/redteam/tools']){
                console.log(JSON.stringify({stage:'compose',ready:false,reason:'missing-required-installed-components'}));process.exitCode=3
              } else {
                const overlay=[]
                const add=row=>{
                  if(pick(base,row.id)) overlay.push(row)
                  else overlay.push({insert:[row]})
                }
                add({id:'agent-default-model',config:{provider:model.config.provider,model:model.config.model,reasoningEffort:'max'}})
                add({id:'agent-preset-registry',...(pick(base,'agent-preset-registry')?{}:{name:registry.name}),config:{...registry.config,selectedDefault:'redteam'}})
                add({id:'subagent',...(pick(base,'subagent')?{}:{name:sub.name}),disabled:false,config:sub.config})
                add({id:'dsh-purge',name:paths['dsh-purge'],inject:purge.inject,config:{...purge.config,autoApplyOnStart:false,autoUpdateOnStart:false,autoRevertOnMissing:false}})
                add({id:'dsh-purge-redteam',name:paths['dsh-purge/redteam']})
                add({id:'dsh-purge-redteam-store',name:paths['dsh-purge/redteam/store'],config:{root:path.join(tmp,'redteam-records')}})
                const patch=path.join(tmp,'qa-overlay.json')
                fs.writeFileSync(patch,JSON.stringify(overlay))
                const result=call(['--profile','codex-review','--patch',patch,'--dump-config'])
                let effective=[]
                try{effective=collect(parse(result.stdout||''))}catch{}
                const m=pick(effective,'agent-default-model'),p=pick(effective,'agent-preset-registry'),s=pick(effective,'subagent')
                const effectiveModel=m?.config||{}
                const ready=result.status===0&&effectiveModel.provider===model.config.provider&&effectiveModel.model===model.config.model&&effectiveModel.reasoningEffort==='max'&&p?.config?.selectedDefault==='redteam'&&!!s&&s.disabled!==true&&['dsh-purge','dsh-purge-redteam','dsh-purge-redteam-store'].every(id=>!!pick(effective,id))
                console.log(JSON.stringify({stage:'compose',...classify(result),ready,model:{provider:label(effectiveModel.provider),model:label(effectiveModel.model),reasoningEffort:label(effectiveModel.reasoningEffort)},preset:label(p?.config?.selectedDefault),subagentEnabled:!!s&&s.disabled!==true,pluginIds:names.filter(id=>!!pick(effective,id))}))
                if(!ready){process.exitCode=4}
                else {
                  // Boot only an isolated copy of the profile. Purge's normal preset
                  // installation and cleanup must never touch the production DSH_HOME.
                  const isolated=path.join(tmp,'home')
                  const target=path.join(isolated,'profiles','codex-review')
                  fs.mkdirSync(target,{recursive:true})
                  for(const item of fs.readdirSync(path.join(profileRoot,'codex-review'),{withFileTypes:true})){
                    if(item.isFile()&&/^(cordis|profile|package)\.(?:yml|yaml|json|mjs|js|cjs)$/.test(item.name))fs.copyFileSync(path.join(profileRoot,'codex-review',item.name),path.join(target,item.name))
                  }
                  const presetSource=path.join(home,'.agent-presets','redteam')
                  if(fs.existsSync(presetSource))fs.cpSync(presetSource,path.join(isolated,'.agent-presets','redteam'),{recursive:true})
                  // Preserve the original headless dependency roots, then add
                  // Desktop-only plugins without replacing the headless tree.
                  const sources=[path.join(profileRoot,'codex-review','node_modules'),path.join(profileRoot,'desktop','node_modules'),path.join(root,'resources/app/dsh/node_modules')]
                  const modules=path.join(target,'node_modules')
                  fs.mkdirSync(modules,{recursive:true})
                  const linkedPackages=[]
                  const linkPackage=(src,dst,name,source)=>{
                    if(fs.existsSync(dst))return
                    try{
                      if(!fs.statSync(src).isDirectory())return
                      fs.symlinkSync(fs.realpathSync(src),dst,'junction')
                      linkedPackages.push({name,source})
                    }catch{}
                  }
                  for(const [sourceIndex,source] of sources.entries()){
                    if(!fs.existsSync(source))continue
                    for(const item of fs.readdirSync(source,{withFileTypes:true})){
                      if(item.name.startsWith('.'))continue
                      const src=path.join(source,item.name),dst=path.join(modules,item.name)
                      if(item.name.startsWith('@')){
                        try{
                          if(!fs.statSync(src).isDirectory())continue
                          fs.mkdirSync(dst,{recursive:true})
                          for(const child of fs.readdirSync(src,{withFileTypes:true}))linkPackage(path.join(src,child.name),path.join(dst,child.name),item.name+'/'+child.name,sourceIndex)
                        }catch{}
                      }else linkPackage(src,dst,item.name,sourceIndex)
                    }
                  }
                  // The preset's relative anchor entry resolves from the profile.
                  const presetAnchor=path.join(isolated,'.agent-presets','redteam','anchor-gate.mjs')
                  if(fs.existsSync(presetAnchor))fs.writeFileSync(path.join(target,'anchor-gate.mjs'),'export * from "../../.agent-presets/redteam/anchor-gate.mjs";\n')
                  const isolatedReq=createRequire(path.join(target,'package.json'))
                  const resolution={}
                  for(const spec of ['@deepseek-ai/dsh-agent-preset-registry','@deepseek-ai/dsh-subagent','dsh-purge','dsh-purge/redteam','dsh-purge/redteam/store','dsh-purge/redteam/tools']){
                    try{isolatedReq.resolve(spec);resolution[spec]=true}catch{resolution[spec]=false}
                  }
                  console.log(JSON.stringify({stage:'isolated-modules',sourceAvailable:sources.map(p=>fs.existsSync(p)),linkedPackages:linkedPackages.length,resolution,anchorBridge:fs.existsSync(path.join(target,'anchor-gate.mjs'))}))
                  // Compare startup one layer at a time. No task, no account
                  // store copied, and no real-model invocation.
                  const rowId=row=>row.id||row.insert?.[0]?.id
                  const makeHome=label=>{
                    const h=path.join(tmp,'home-'+label)
                    const p=path.join(h,'profiles','codex-review')
                    fs.mkdirSync(p,{recursive:true})
                    for(const item of fs.readdirSync(path.join(profileRoot,'codex-review'),{withFileTypes:true})){
                      if(item.isFile()&&/^(cordis|profile|package)\.(?:yml|yaml|json|mjs|js|cjs)$/.test(item.name))fs.copyFileSync(path.join(profileRoot,'codex-review',item.name),path.join(p,item.name))
                    }
                    fs.symlinkSync(modules,path.join(p,'node_modules'),'junction')
                    if(fs.existsSync(presetSource))fs.cpSync(presetSource,path.join(h,'.agent-presets','redteam'),{recursive:true})
                    if(fs.existsSync(path.join(h,'.agent-presets','redteam','anchor-gate.mjs')))fs.writeFileSync(path.join(p,'anchor-gate.mjs'),'export * from "../../.agent-presets/redteam/anchor-gate.mjs";\n')
                    return h
                  }
                  const routeOnly=overlay.filter(row=>['agent-default-model','subagent'].includes(rowId(row)))
                  const standard=JSON.parse(JSON.stringify(overlay))
                  for(const row of standard){
                    const entry=row.insert?.[0]||row
                    if(entry.id==='agent-preset-registry')entry.config.selectedDefault='standard'
                  }
                  const variants=[
                    {name:'original-headless',home,patch:null},
                    {name:'isolated-base',home:makeHome('base'),patch:null},
                    {name:'isolated-max-subagent',home:makeHome('max'),patch:routeOnly},
                    {name:'isolated-purge-standard',home:makeHome('standard'),patch:standard},
                    {name:'isolated-purge-redteam',home:makeHome('redteam'),patch:overlay},
                  ]
                  const results=[]
                  for(const v of variants){
                    const args=['--profile','codex-review']
                    if(v.patch){const fp=path.join(tmp,v.name+'.json');fs.writeFileSync(fp,JSON.stringify(v.patch));args.push('--patch',fp)}
                    const began=Date.now()
                    const res=call([...args,'--help'],v.home,45000)
                    const events=(res.stdout||'').split(/\r?\n/).map(l=>{try{return JSON.parse(l)}catch{return null}}).filter(Boolean)
                    const detail={name:v.name,elapsedMs:Date.now()-began,...classify(res),help:/(?:Usage:|--json)/.test(res.stdout||''),...failureDetails(res,events)}
                    results.push(detail)
                    console.log(JSON.stringify({stage:'startup-layer',...detail,modelRequests:0}))
                  }
                  console.log(JSON.stringify({stage:'startup-comparison',results:results.map(({name,exit,timeout,elapsedMs,help})=>({name,exit,timeout,elapsedMs,help})),modelRequests:0}))
                  if(results.some(r=>r.exit!==0||!r.help))process.exitCode=5

                }
              }
            }
          } finally { fs.rmSync(tmp,{recursive:true,force:true}) }
          '@ | Set-Content -Path $script -Encoding UTF8
          node $script
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
