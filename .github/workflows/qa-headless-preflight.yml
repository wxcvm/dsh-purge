name: QA Desktop Native Archive Review
on:
  pull_request:
    types: [synchronize, reopened]
permissions:
  contents: read
jobs:
  desktop-review:
    if: github.head_ref == 'robin/qa-headless-paired-retry-20261116'
    runs-on: [self-hosted, Windows]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Score only the two designated Desktop QA conversations
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Join-Path $env:RUNNER_TEMP 'purge-desktop-review.mjs'
          @'
          import fs from 'node:fs'
          import os from 'node:os'
          import path from 'node:path'
          import { pathToFileURL } from 'node:url'
          const workspace=process.env.GITHUB_WORKSPACE
          const load=p=>import(pathToFileURL(path.join(workspace,p)).href)
          const {cases}=await load('scripts/agent-quality-eval.mjs')
          const {decodeArchive,archiveEvents,extractMarkedTurn,importReviewRun}=await load('scripts/review-trace-import.mjs')
          const {compareReviewRuns}=await load('scripts/review-run-compare.mjs')
          const {reconcileReviewBatch}=await load('scripts/review-batch-eval.mjs')
          const {messageText,messageOf}=await load('lib/response-context.js')
          const root=path.join(process.env.DSH_HOME||path.join(os.homedir(),'.dsh'),'sessions')
          const label=v=>typeof v==='string'&&/^[\w./:@+-]{1,120}$/.test(v)?v:null
          const modes=['direct','delegated','review']
          const runIds=Object.fromEntries(modes.map(mode=>[mode,'DS41-DESKTOP-20261116-'+mode.toUpperCase()+'-01']))
          const candidates=[]
          const recent=Date.now()-48*60*60*1000
          const visit=(folder,depth)=>{
            let entries=[]
            try{entries=fs.readdirSync(folder,{withFileTypes:true})}catch{return}
            for(const dir of entries){
              if(!dir.isDirectory()||dir.isSymbolicLink())continue
              const child=path.join(folder,dir.name)
              for(const name of ['session.v4.jsonl.zstd','session.v4.jsonl']){
                const file=path.join(child,name)
                try{
                  const st=fs.lstatSync(file)
                  if(!st.isFile()||st.isSymbolicLink()||st.mtimeMs<recent)continue
                  candidates.push({sessionId:dir.name,file,mtime:st.mtimeMs,depth:depth+1})
                  break
                }catch{}
              }
              // Native Desktop layout is sessions/<bucket>/<session-id>/.
              if(depth<1)visit(child,depth+1)
            }
          }
          visit(root,0)
          candidates.sort((a,b)=>b.mtime-a.mtime)
          console.log(JSON.stringify({stage:'archive-scan',rootPresent:fs.existsSync(root),recentArchiveCandidates:candidates.length,byDepth:{one:candidates.filter(x=>x.depth===1).length,two:candidates.filter(x=>x.depth===2).length}}))
          const observations=Object.fromEntries(modes.map(mode=>[mode,[]]))
          let unreadable=0
          for(const candidate of candidates){
            let records
            try{records=decodeArchive(fs.readFileSync(candidate.file))}catch{unreadable++;continue}
            for(const mode of modes){
              const marker='PURGE-QA-RUN: '+runIds[mode]
              try{
                const trace=extractMarkedTurn(records,marker,{child:true})
                let human=false
                try{extractMarkedTurn(records,marker);human=true}catch{}
                const ev=archiveEvents(records).events.find(e=>e.seq===trace.humanSeq)
                const task=messageText(messageOf(ev))
                const caseIds=cases.filter(c=>task.includes(c.id)).map(c=>c.id)
                observations[mode].push({sessionId:candidate.sessionId,records,trace,human,caseIds})
              }catch{}
            }
          }
          // Output compliance and answer accuracy are separate observations.
          // Score an exact, unique JSON code block if the native final has one;
          // never emit arbitrary prose, raw answer text or tool arguments.
          const {evaluate,answerKey}=await load('scripts/agent-quality-eval.mjs')
          const allIds=cases.map(c=>c.id)
          function finalReportDiagnostic(trace,assigned=allIds){
            const raw=trace.finalText
            if(typeof raw!=='string'||!raw.trim())return {shape:'missing-final-text',textLength:raw?.length??0,contentScore:null,evidenceDetails:[]}
            const text=raw.trim()
            const reportRows=v=>Array.isArray(v?.reports)?v.reports:assigned.length===1&&v?.id===assigned[0]&&Object.hasOwn(v,'answer')&&Object.hasOwn(v,'evidence')?[v]:null
            let value=null,shape='unrecognized'
            try{value=JSON.parse(text);shape='strict-json'}catch{}
            if(!reportRows(value)){
              const fence=String.fromCharCode(96).repeat(3)
              const pattern=new RegExp(fence+'(?:json)?[\\t ]*\\r?\\n([\\s\\S]*?)\\r?\\n'+fence,'gi')
              const blocks=[...text.matchAll(pattern)]
              if(blocks.length===1){
                try{const v=JSON.parse(blocks[0][1]);if(reportRows(v)){value=v;shape=blocks[0][0]===text?'single-json-fence':'json-fence-with-prose'}}catch{}
              }
            }
            const result={shape,textLength:text.length,hasReportsKey:/"reports"\s*:/.test(text),mentionedFixtureIds:cases.filter(c=>text.includes(c.id)).length,contentScore:null,evidenceDetails:[]}
            const rows=reportRows(value)
            if(!rows)return result
            const ids=new Set(assigned)
            const known=rows.filter(row=>ids.has(row?.id))
            result.reportCount=rows.length
            result.knownCaseCount=new Set(known.map(row=>row.id)).size
            result.foreignReports=rows.length-known.length
            result.duplicateCaseReports=known.length-result.knownCaseCount
            if(result.duplicateCaseReports||result.foreignReports)return result
            const byId=new Map(cases.map(c=>[c.id,c]))
            const reports=known.map(row=>({id:row.id,answer:['a','b','c'].includes(row.answer)?row.answer:null,evidence:Array.isArray(row.evidence)?row.evidence.map(key=>typeof key==='string'&&Object.hasOwn(byId.get(row.id).records,key)?key:'__invalid_evidence__'):null}))
            const evaluated=evaluate({reports})
            const results=evaluated.results.filter(row=>ids.has(row.id))
            result.contentScore={summary:{total:assigned.length,completed:results.filter(r=>r.completed).length,correctConclusions:results.filter(r=>r.conclusionCorrect).length,correctEvidence:results.filter(r=>r.evidenceCorrect).length,passed:results.filter(r=>r.passed).length},results}
            result.evidenceDetails=reports.map(row=>{
              const expected=answerKey[row.id].evidence
              const knownKeys=Array.isArray(row.evidence)?row.evidence.filter(k=>k!=='__invalid_evidence__'):[]
              const unique=[...new Set(knownKeys)]
              return {id:row.id,answer:row.answer,expectedAnswer:answerKey[row.id].answer,expected,observed:unique,missing:expected.filter(k=>!unique.includes(k)),additional:unique.filter(k=>!expected.includes(k)),invalidCount:Array.isArray(row.evidence)?row.evidence.length-knownKeys.length:null,duplicateCount:Array.isArray(row.evidence)?knownKeys.length-unique.length:null,coversRequired:row.evidence!==null&&expected.every(k=>unique.includes(k))}
            })
            return result
          }
          function requestConfigEvidence(spec){
            const {events}=archiveEvents(spec.records)
            const end=events.find(e=>e.seq>spec.trace.humanSeq&&e.type==='turn/end'&&e.data?.turn===spec.trace.turn)
            const requests=events.filter(e=>e.seq>spec.trace.humanSeq&&(!end||e.seq<end.seq)&&e.type==='request/header')
            const firstRequest=requests[0]?.seq??null
            const presets=events.filter(e=>e.type==='agent-preset/selected').map(e=>({seq:e.seq,preset:label(e.data?.agentPreset||e.data?.preset||e.data?.name),phase:e.seq<spec.trace.humanSeq?'before-marked-message':end&&e.seq>end.seq?'after-marked-turn':'during-marked-turn'})).filter(r=>r.preset)
            return {lastPresetBeforeFirstRequest:firstRequest===null?null:presets.filter(p=>p.seq<firstRequest).at(-1)?.preset??null,presetTimeline:presets,requestRoutes:[...new Set(requests.map(e=>{const c=e.data?.header?.config;return c?JSON.stringify({provider:label(c.provider),model:label(c.model),reasoningEffort:label(c.reasoningEffort)}):null}).filter(Boolean))].map(JSON.parse)}
          }
          const outcomes={}
          const contentOutcomes={}
          for(const mode of modes){
            const observed=observations[mode]
            const parents=observed.filter(row=>row.human&&!observed.some(other=>other!==row&&other.trace.childIds.includes(row.sessionId))&&!row.trace.parentRefs.some(id=>observed.some(other=>other.sessionId===id)))
            if(parents.length!==1){
              console.log(JSON.stringify({stage:'desktop-review',mode,runId:runIds[mode],status:parents.length?'ambiguous':'not-found',markedArchives:observed.length,parentCandidates:parents.length}))
              continue
            }
            const parent=parents[0]
            const linked=observed.filter(row=>row!==parent&&(parent.trace.childIds.includes(row.sessionId)||row.trace.parentRefs.includes(parent.sessionId)))
            const claims=new Map()
            for(const child of linked)for(const id of child.caseIds)claims.set(id,(claims.get(id)||0)+1)
            const children=linked.filter(row=>row.caseIds.length>0&&row.caseIds.every(id=>claims.get(id)===1)&&row.trace.parentRefs.every(id=>id===parent.sessionId))
            const score=importReviewRun({runId:runIds[mode],parent,children,settingsId:'desktop-user-reported-max-redteam'})
            outcomes[mode]=score
            const {events}=archiveEvents(parent.records)
            const configEvidence=requestConfigEvidence(parent)
            const permissionEvidence=events.filter(e=>e.type==='permission/preset').map(e=>label(e.data?.preset||e.data?.permissionPreset)).filter(Boolean)
            const finalReport=finalReportDiagnostic(parent.trace)
            contentOutcomes[mode]={status:parent.trace.lifecycle,report:finalReport,usage:score.usage,children:children.length}
            const childReports=children.map(child=>({caseIds:child.caseIds,lifecycle:child.trace.lifecycle,configEvidence:requestConfigEvidence(child),report:finalReportDiagnostic(child.trace,child.caseIds)}))
            const parentRows=new Map(finalReport.evidenceDetails.map(row=>[row.id,row]))
            const childRows=new Map(childReports.flatMap(c=>c.report.evidenceDetails).map(row=>[row.id,row]))
            const childParentEvidence=cases.map(c=>{
              const child=childRows.get(c.id),parent=parentRows.get(c.id)
              return {id:c.id,child:child?{answerCorrect:child.answer===child.expectedAnswer,coversRequired:child.coversRequired,exactEvidence:child.coversRequired&&child.additional.length===0&&child.invalidCount===0&&child.duplicateCount===0}:null,parent:parent?{answerCorrect:parent.answer===parent.expectedAnswer,coversRequired:parent.coversRequired,exactEvidence:parent.coversRequired&&parent.additional.length===0&&parent.invalidCount===0&&parent.duplicateCount===0}:null,evidenceSetMatch:child&&parent?child.observed.length===parent.observed.length&&child.observed.every(k=>parent.observed.includes(k)):null}
            })
            console.log(JSON.stringify({stage:'desktop-review',mode,status:parent.trace.lifecycle,route:score.route,requestRoutes:configEvidence.requestRoutes,presetEvidence:[...new Set(configEvidence.presetTimeline.map(p=>p.preset))],lastPresetBeforeFirstRequest:configEvidence.lastPresetBeforeFirstRequest,presetTimeline:configEvidence.presetTimeline,permissionEvidence:[...new Set(permissionEvidence)],score:reconcileReviewBatch(score.batch).summary,finalReport,archiveCoverage:score.archiveCoverage,usage:score.usage,delegationTimeline:score.delegationTimeline,linkedMarkedChildren:linked.length,scoredChildren:children.length}))
            if(mode==='delegated')console.log(JSON.stringify({stage:'child-content-review',childReports,childParentEvidence}))

          }
          if(outcomes.direct&&outcomes.delegated)console.log(JSON.stringify({stage:'desktop-pair',status:'observed',comparison:compareReviewRuns(outcomes),scope:'native-desktop-archives',billing:'not-observed'}))
          else console.log(JSON.stringify({stage:'desktop-pair',status:'incomplete',missing:['direct','delegated'].filter(mode=>!outcomes[mode]),recentArchiveCandidates:candidates.length,unreadableArchives:unreadable}))
          if(contentOutcomes.review)console.log(JSON.stringify({stage:'independent-review-result',status:contentOutcomes.review.status,arms:Object.fromEntries(Object.entries(contentOutcomes).map(([mode,v])=>[mode,{status:v.status,format:v.report.shape,summary:v.report.contentScore?.summary??null,requiredCoverage:v.report.evidenceDetails.filter(r=>r.coversRequired).length,missingEvidence:v.report.evidenceDetails.filter(r=>r.missing.length).map(r=>({id:r.id,missing:r.missing})),elapsedMs:v.usage.elapsedMs,modelResponses:v.usage.modelResponses,toolStarts:v.usage.toolStarts,archiveTotalTokens:v.usage.totalTokens,observedChildren:v.children}])),scope:'one synthetic replay, not a live capability or causal proof'}))
          '@ | Set-Content -Path $script -Encoding UTF8
          node $script
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
